name: Test blog

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_ID: ryan
      PUBLIC_SITE_URL: https://blog.ryanspice.com
      # Checks use synthetic identity inputs; private content tests set their own
      # fixture owner. No production registration or owner secret is needed.
      VITE_MSAL_CLIENT_ID: '00000000-0000-0000-0000-000000000000'
      VITE_MSAL_TENANT_ID: common
      VITE_MSAL_REDIRECT_URI: https://blog.ryanspice.com/auth/callback/

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Normalize pnpm config for CI
        shell: pwsh
        run: |
          @(
            "node-linker=isolated",
            "strict-peer-dependencies=false",
            "store-dir=${{ runner.temp }}/pnpm-store",
            "virtual-store-dir=node_modules/.pnpm"
          ) | Set-Content -LiteralPath .npmrc -Encoding utf8NoBOM

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.0.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up PHP for isolated owner endpoint fixtures
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Audit source contract
        run: pnpm run audit:files

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Verify private content delivery and public build confidentiality
        run: pnpm run test:confidentiality
