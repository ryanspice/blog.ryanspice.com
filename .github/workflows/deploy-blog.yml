name: Deploy production blogs

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-blogs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: ${{ secrets.PUBLIC_BASE_PATH }}
      VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
      VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID || 'common' }}
      VITE_MSAL_REDIRECT_URI: ${{ secrets.VITE_MSAL_REDIRECT_URI }}
      VITE_OWNER_EMAIL_SHA256: ${{ secrets.VITE_OWNER_EMAIL_SHA256 }}
      VITE_OWNER_ACCESS_LABEL: ${{ secrets.VITE_OWNER_ACCESS_LABEL || 'the site owner account' }}
      BLOG_OWNER_EMAIL_SHA256: ${{ secrets.BLOG_OWNER_EMAIL_SHA256 || secrets.VITE_OWNER_EMAIL_SHA256 }}
      BLOG_DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
      BLOG_DEPLOY_USER: ${{ secrets.BLOG_DEPLOY_USER }}
      BLOG_DEPLOY_PORT: ${{ secrets.BLOG_DEPLOY_PORT }}
      BLOG_DEPLOY_PATH: ${{ secrets.BLOG_DEPLOY_PATH }}
      BLOG_PUBLIC_URL: ${{ secrets.BLOG_PUBLIC_URL || secrets.PUBLIC_SITE_URL || 'https://blog.ryanspice.com/' }}
      BLOG_BASE_PATH: ${{ secrets.BLOG_BASE_PATH || secrets.PUBLIC_BASE_PATH }}
      CANOPY_BLOG_DEPLOY_HOST: ${{ secrets.CANOPY_BLOG_DEPLOY_HOST || secrets.BLOG_DEPLOY_HOST }}
      CANOPY_BLOG_DEPLOY_USER: ${{ secrets.CANOPY_BLOG_DEPLOY_USER || secrets.BLOG_DEPLOY_USER }}
      CANOPY_BLOG_DEPLOY_PORT: ${{ secrets.CANOPY_BLOG_DEPLOY_PORT || secrets.BLOG_DEPLOY_PORT }}
      CANOPY_BLOG_DEPLOY_PATH: ${{ secrets.CANOPY_BLOG_DEPLOY_PATH || 'domains/blog.canopydigital.ca/public_html' }}
      CANOPY_BLOG_PUBLIC_URL: ${{ secrets.CANOPY_BLOG_PUBLIC_URL || 'https://blog.canopydigital.ca/' }}
      CANOPY_BLOG_BASE_PATH: ${{ secrets.CANOPY_BLOG_BASE_PATH }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Normalize pnpm config for CI
        shell: pwsh
        run: |
          @(
            "node-linker=isolated",
            "strict-peer-dependencies=false",
            "store-dir=${{ runner.temp }}/pnpm-store",
            "virtual-store-dir=node_modules/.pnpm"
          ) | Set-Content -LiteralPath .npmrc -Encoding utf8NoBOM

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        shell: pwsh
        run: |
          $required = @(
            "BLOG_DEPLOY_HOST",
            "BLOG_DEPLOY_USER",
            "BLOG_DEPLOY_PATH",
            "CANOPY_BLOG_DEPLOY_HOST",
            "CANOPY_BLOG_DEPLOY_USER",
            "CANOPY_BLOG_DEPLOY_PATH",
            "VITE_MSAL_CLIENT_ID"
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required production deploy environment value: $name"
            }
          }

      - name: Create shared release id
        shell: pwsh
        run: |
          $releaseId = (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ")
          "BLOG_RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit source contract
        run: pnpm run audit:files

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build Ryan PHP release
        shell: pwsh
        run: |
          $env:PUBLIC_SITE_ID = "ryan"
          $env:BLOG_SITE_ID = "ryan"
          $env:PUBLIC_SITE_URL = $env:BLOG_PUBLIC_URL.TrimEnd("/")
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/Build-BlogStatic.ps1 -Clean -SiteId ryan -PublicSiteUrl $env:PUBLIC_SITE_URL

      - name: Audit Ryan PHP release
        run: pnpm run audit:seo

      - name: Write shared deploy key
        shell: pwsh
        env:
          BLOG_DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
          BLOG_DEPLOY_KEY_B64: ${{ secrets.BLOG_DEPLOY_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLOG_DEPLOY_KEY) -and [string]::IsNullOrWhiteSpace($env:BLOG_DEPLOY_KEY_B64)) {
            throw "Missing BLOG_DEPLOY_KEY secret."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "blog_deploy_key"
          if (-not [string]::IsNullOrWhiteSpace($env:BLOG_DEPLOY_KEY_B64)) {
            [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:BLOG_DEPLOY_KEY_B64.Trim()))
          } else {
            $normalized = $env:BLOG_DEPLOY_KEY.Replace("`r`n", "`n").TrimEnd() + "`n"
            [System.IO.File]::WriteAllText($keyPath, $normalized, [System.Text.UTF8Encoding]::new($false))
          }
          chmod 600 $keyPath
          ssh-keygen -y -f $keyPath > $null
          "BLOG_DEPLOY_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy and activate Ryan production
        shell: pwsh
        run: |
          $env:PUBLIC_SITE_ID = "ryan"
          $env:BLOG_SITE_ID = "ryan"
          $env:PUBLIC_SITE_URL = $env:BLOG_PUBLIC_URL.TrimEnd("/")
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/Deploy-BlogStatic.ps1 -Apply -Activate -ReleaseId $env:BLOG_RELEASE_ID

      - name: Build Canopy PHP release
        shell: pwsh
        run: |
          $env:PUBLIC_SITE_ID = "canopy"
          $env:BLOG_SITE_ID = "canopy"
          $env:PUBLIC_SITE_URL = $env:CANOPY_BLOG_PUBLIC_URL.TrimEnd("/")
          $env:BLOG_BASE_PATH = $env:CANOPY_BLOG_BASE_PATH
          $env:PUBLIC_BASE_PATH = $env:CANOPY_BLOG_BASE_PATH
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/Build-BlogStatic.ps1 -Clean -SiteId canopy -PublicSiteUrl $env:PUBLIC_SITE_URL

      - name: Audit Canopy PHP release
        run: pnpm run audit:seo

      - name: Deploy and activate Canopy production
        shell: pwsh
        run: |
          $env:PUBLIC_SITE_ID = "canopy"
          $env:BLOG_SITE_ID = "canopy"
          $env:PUBLIC_SITE_URL = $env:CANOPY_BLOG_PUBLIC_URL.TrimEnd("/")
          $env:BLOG_DEPLOY_HOST = $env:CANOPY_BLOG_DEPLOY_HOST
          $env:BLOG_DEPLOY_USER = $env:CANOPY_BLOG_DEPLOY_USER
          $env:BLOG_DEPLOY_PORT = $env:CANOPY_BLOG_DEPLOY_PORT
          $env:BLOG_DEPLOY_PATH = $env:CANOPY_BLOG_DEPLOY_PATH
          $env:BLOG_PUBLIC_URL = $env:CANOPY_BLOG_PUBLIC_URL
          $env:BLOG_BASE_PATH = $env:CANOPY_BLOG_BASE_PATH
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/Deploy-BlogStatic.ps1 -Apply -Activate -ReleaseId $env:BLOG_RELEASE_ID
