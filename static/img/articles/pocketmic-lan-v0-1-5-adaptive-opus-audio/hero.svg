<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">PocketMic LAN v0.1.5 uses Opus audio and adaptive buffering</title>
  <desc id="desc">A vertical diagram shows a private encrypted audio stream from Android through Opus and an adaptive jitter buffer to a Windows receiver. Live end-to-end device checks remain open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12283a"/></linearGradient>
    <linearGradient id="cyan"><stop stop-color="#48c5d6"/><stop offset="1" stop-color="#2f9bc2"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#f4c273"/><stop offset="1" stop-color="#f59e69"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="800" height="1000" rx="36" fill="url(#bg)"/>
  <circle cx="690" cy="180" r="150" fill="#163d52" opacity=".35"/>
  <circle cx="90" cy="860" r="170" fill="#17354c" opacity=".4"/>
  <text x="400" y="92" text-anchor="middle" fill="#48c5d6" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">POCKETMIC LAN · V0.1.5</text>
  <text x="400" y="150" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Opus audio</text>
  <text x="400" y="194" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Adaptive buffering</text>
  <text x="400" y="232" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI,Arial,sans-serif" font-size="19">A private Android-to-Windows microphone link</text>
  <g filter="url(#shadow)">
    <rect x="132" y="278" width="536" height="112" rx="24" fill="#0b1928" stroke="#28445b" stroke-width="3"/>
    <rect x="166" y="298" width="468" height="72" rx="19" fill="#12283a" stroke="#48c5d6" stroke-width="3"/>
    <text x="400" y="343" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Android · 48 kHz mic</text>
    <path d="M400 402v28" stroke="#48c5d6" stroke-width="5" stroke-dasharray="8 9"/>
    <rect x="132" y="440" width="536" height="132" rx="24" fill="#0b1928" stroke="#28445b" stroke-width="3"/>
    <rect x="166" y="461" width="468" height="90" rx="19" fill="url(#cyan)"/>
    <text x="400" y="500" text-anchor="middle" fill="#07111f" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Opus · Protocol v2</text>
    <text x="400" y="530" text-anchor="middle" fill="#07111f" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">AES-GCM encrypted UDP</text>
    <path d="M400 584v28" stroke="#48c5d6" stroke-width="5" stroke-dasharray="8 9"/>
    <rect x="132" y="622" width="536" height="112" rx="24" fill="#0b1928" stroke="#28445b" stroke-width="3"/>
    <rect x="166" y="642" width="468" height="72" rx="19" fill="#12283a" stroke="#48c5d6" stroke-width="3"/>
    <text x="400" y="687" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Windows receiver</text>
    <rect x="82" y="774" width="636" height="142" rx="24" fill="#13273a" stroke="#28445b" stroke-width="2"/>
    <text x="400" y="818" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Adaptive jitter handling</text>
    <text x="400" y="852" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI,Arial,sans-serif" font-size="17">Buffer responds to packet arrival variation.</text>
    <text x="400" y="884" text-anchor="middle" fill="#f4c273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Live-device checks remain open</text>
  </g>
</svg>
