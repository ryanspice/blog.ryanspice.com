<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fable 5 fallback routing map</title>
  <desc id="desc">A routing diagram showing Fable 5 as a removed premium evidence lane, with fallback work split across Claude Code, deterministic source inventory, DeepSeek Pro risk review, Gemma4 local sanity checks, and the lead router.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1c2334"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f2d27c"/>
      <stop offset="1" stop-color="#53b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fcaff"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="44" y="44" width="1112" height="632" rx="24" fill="#0c1626" stroke="#27364d" stroke-width="2"/>

  <text x="80" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">When Fable 5 disappears</text>
  <text x="80" y="132" fill="#aab7cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Preserve the evidence standard by splitting the premium lane into explicit fallback work.</text>
  <rect x="80" y="154" width="520" height="4" fill="url(#accent)" rx="2"/>

  <g filter="url(#shadow)">
    <rect x="455" y="190" width="290" height="118" rx="14" fill="#142033" stroke="#53b8ff" stroke-width="2"/>
    <text x="600" y="232" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Lead / Router</text>
    <text x="600" y="264" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="17">Hermes + GPT-5.5</text>
    <text x="600" y="288" text-anchor="middle" fill="#91a9c8" font-family="Segoe UI, Arial, sans-serif" font-size="14">scope, synthesis, confidence, final decision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="348" width="260" height="98" rx="14" fill="#2b1f23" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="600" y="389" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Fable 5 Lane</text>
    <text x="600" y="420" text-anchor="middle" fill="#ffd3d3" font-family="Segoe UI, Arial, sans-serif" font-size="16">unavailable / unstable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="515" width="225" height="96" rx="14" fill="#1f2937" stroke="#f2d27c" stroke-width="2"/>
    <text x="192" y="553" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Claude Code</text>
    <text x="192" y="582" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="14">narrow patch and review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="515" width="225" height="96" rx="14" fill="#182437" stroke="#7c5cff" stroke-width="2"/>
    <text x="462" y="553" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Source Audit</text>
    <text x="462" y="582" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="14">tests, grep, route manifests</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="515" width="225" height="96" rx="14" fill="#172338" stroke="#53b8ff" stroke-width="2"/>
    <text x="737" y="553" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">DeepSeek Pro</text>
    <text x="737" y="582" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="14">risk and disagreement pass</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="895" y="515" width="225" height="96" rx="14" fill="#132a26" stroke="#87dac4" stroke-width="2"/>
    <text x="1007" y="553" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Gemma4</text>
    <text x="1007" y="582" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="14">local sanity check</text>
  </g>

  <path d="M 600 310 L 600 344" fill="none" stroke="#9fcaff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 540 446 C 430 484 290 489 196 510" fill="none" stroke="#9fcaff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 575 446 C 520 476 485 489 464 510" fill="none" stroke="#9fcaff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 625 446 C 675 476 713 489 735 510" fill="none" stroke="#9fcaff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 660 446 C 790 484 920 489 1005 510" fill="none" stroke="#9fcaff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="146" y="637" width="908" height="40" rx="12" fill="#0b1220" stroke="#27364d"/>
  <text x="600" y="663" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="17">Fallback principle: keep the Fable-grade evidence bar even when Fable is gone.</text>
</svg>
