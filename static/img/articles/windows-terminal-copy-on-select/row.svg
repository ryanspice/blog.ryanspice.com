<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Copy on highlight row card</title>
  <desc id="desc">A compact terminal card showing highlighted copyOnSelect text and a clipboard indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="selection" x1="0" x2="1">
      <stop offset="0" stop-color="#53b8ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="820" cy="110" r="170" fill="#53b8ff" opacity="0.08"/>
  <circle cx="110" cy="480" r="220" fill="#7c5cff" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="86" y="92" width="600" height="310" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="86" y="92" width="600" height="56" rx="26" fill="#202b3b"/>
    <path d="M86 122 Q86 92 116 92 H656 Q686 92 686 122 V148 H86 Z" fill="#202b3b"/>
    <circle cx="126" cy="120" r="8" fill="#ff6b6b"/>
    <circle cx="154" cy="120" r="8" fill="#f6c85f"/>
    <circle cx="182" cy="120" r="8" fill="#5ad17a"/>

    <text x="126" y="207" font-family="Cascadia Mono, Consolas, monospace" font-size="20" fill="#8ee6a3">PS&gt;</text>
    <rect x="126" y="238" width="420" height="42" rx="10" fill="url(#selection)"/>
    <text x="148" y="266" font-family="Cascadia Mono, Consolas, monospace" font-size="21" fill="#ffffff">&quot;copyOnSelect&quot;: true</text>
    <text x="126" y="334" font-family="Cascadia Mono, Consolas, monospace" font-size="20" fill="#d8e4f2">select text → copied</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="716" y="166" width="150" height="194" rx="22" fill="#f8fafc"/>
    <rect x="758" y="144" width="66" height="42" rx="12" fill="#d8e4f2"/>
    <rect x="748" y="214" width="84" height="12" rx="6" fill="#172033" opacity="0.34"/>
    <rect x="748" y="246" width="94" height="12" rx="6" fill="#172033" opacity="0.2"/>
    <rect x="748" y="304" width="88" height="30" rx="11" fill="#53b8ff" opacity="0.24"/>
    <text x="792" y="325" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#172033">COPIED</text>
  </g>

  <text x="86" y="465" font-family="Inter, Segoe UI, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Windows Terminal: copy on highlight</text>
  <text x="86" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#b8c7dc">A small setting that removes a lot of copy/paste friction.</text>
</svg>
