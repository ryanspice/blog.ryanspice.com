<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Windows Terminal copy on highlight hero illustration</title>
  <desc id="desc">A stylized terminal window shows selected text flowing into a clipboard to represent automatic copy on highlight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#263244"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="selection" x1="0" x2="1">
      <stop offset="0" stop-color="#53b8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="190" fill="#53b8ff" opacity="0.08"/>
  <circle cx="120" cy="560" r="260" fill="#7c5cff" opacity="0.08"/>
  <path d="M80 520 C250 430 370 575 520 485 S780 430 1080 500" fill="none" stroke="#53b8ff" stroke-width="2" opacity="0.18"/>

  <g filter="url(#softShadow)">
    <rect x="118" y="108" width="710" height="400" rx="28" fill="url(#panel)" stroke="#3a4a63" stroke-width="2"/>
    <rect x="118" y="108" width="710" height="60" rx="28" fill="#202b3b"/>
    <path d="M118 140 Q118 108 150 108 H796 Q828 108 828 140 V168 H118 Z" fill="#202b3b"/>
    <circle cx="158" cy="139" r="9" fill="#ff6b6b" opacity="0.9"/>
    <circle cx="190" cy="139" r="9" fill="#f6c85f" opacity="0.9"/>
    <circle cx="222" cy="139" r="9" fill="#5ad17a" opacity="0.9"/>
    <text x="258" y="145" font-family="Cascadia Mono, Consolas, monospace" font-size="17" fill="#b8c7dc">PowerShell — Windows Terminal</text>

    <text x="158" y="225" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#8ee6a3">PS&gt;</text>
    <text x="212" y="225" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#d8e4f2">Get-Content settings.json</text>

    <rect x="154" y="258" width="500" height="42" rx="10" fill="url(#selection)" opacity="0.92"/>
    <text x="176" y="286" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#ffffff">&quot;copyOnSelect&quot;: true</text>

    <text x="158" y="355" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#8ee6a3">PS&gt;</text>
    <text x="212" y="355" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#d8e4f2">highlight text → clipboard</text>
    <rect x="158" y="393" width="330" height="18" rx="9" fill="#90a4bd" opacity="0.28"/>
    <rect x="158" y="425" width="510" height="18" rx="9" fill="#90a4bd" opacity="0.18"/>
  </g>

  <g filter="url(#glow)">
    <path d="M702 278 C788 278 812 278 892 278" fill="none" stroke="#53b8ff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M872 248 L908 278 L872 308" fill="none" stroke="#53b8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="892" y="170" width="198" height="264" rx="24" fill="#f8fafc" stroke="#cdd6e3" stroke-width="3"/>
    <rect x="948" y="146" width="86" height="52" rx="14" fill="#d8e4f2" stroke="#a9b8cc" stroke-width="3"/>
    <rect x="938" y="210" width="105" height="14" rx="7" fill="#172033" opacity="0.34"/>
    <rect x="938" y="244" width="122" height="14" rx="7" fill="#172033" opacity="0.22"/>
    <rect x="938" y="278" width="84" height="14" rx="7" fill="#172033" opacity="0.22"/>
    <rect x="938" y="336" width="96" height="34" rx="12" fill="#53b8ff" opacity="0.22"/>
    <text x="986" y="358" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#172033">COPIED</text>
  </g>

  <text x="118" y="568" font-family="Inter, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">Copy on highlight in Windows Terminal</text>
  <text x="118" y="602" font-family="Inter, Segoe UI, sans-serif" font-size="21" fill="#b8c7dc">One PowerShell command. One settings key. Faster terminal workflow.</text>
</svg>
