<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GLM-5.2 delegate fuse architecture</title>
  <desc id="desc">A fast lead delegates one bounded reasoning task to GLM-5.2, then hands a compact result to a coder worker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102235"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="delegate" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#9bdcff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 690 C260 610 440 760 720 670 C950 595 1130 450 1600 545 L1600 900 L0 900 Z" fill="#0b1624" opacity="0.76"/>
  <path d="M0 755 C300 690 470 810 760 735 C1060 655 1240 620 1600 700" fill="none" stroke="#1f3b52" stroke-width="3" opacity="0.8"/>

  <g transform="translate(120 94)">
    <text x="0" y="0" fill="#e5f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">GLM-5.2 works best as a bounded delegate</text>
    <text x="2" y="50" fill="#a7c7d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">Spend the expensive reasoning on one hard slice, then return a compact result.</text>
  </g>

  <g filter="url(#soft)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(118 270)">
      <rect width="295" height="190" rx="18" fill="#0f2435" stroke="#5eead4" stroke-width="2"/>
      <text x="34" y="58" fill="#dffcff" font-size="30" font-weight="800">Fast lead</text>
      <text x="34" y="101" fill="#a7c7d9" font-size="21">routes work</text>
      <text x="34" y="132" fill="#a7c7d9" font-size="21">handles failures</text>
      <text x="34" y="163" fill="#a7c7d9" font-size="21">keeps session alive</text>
    </g>

    <g transform="translate(518 250)">
      <rect width="385" height="230" rx="22" fill="#06273a" stroke="url(#delegate)" stroke-width="4"/>
      <rect x="30" y="28" width="148" height="34" rx="17" fill="#103d52" stroke="#38bdf8"/>
      <text x="47" y="52" fill="#bff3ff" font-size="16" font-weight="800">EXPENSIVE SLICE</text>
      <text x="30" y="102" fill="#e8fbff" font-size="33" font-weight="900">GLM-5.2 delegate</text>
      <text x="30" y="145" fill="#b8d8e8" font-size="21">one root-cause pass</text>
      <text x="30" y="176" fill="#b8d8e8" font-size="21">one architecture review</text>
      <text x="30" y="207" fill="#b8d8e8" font-size="21">one scoped patch plan</text>
    </g>

    <g transform="translate(1008 270)">
      <rect width="300" height="190" rx="18" fill="#0f2435" stroke="#93c5fd" stroke-width="2"/>
      <text x="34" y="58" fill="#e6f0ff" font-size="30" font-weight="800">Coder worker</text>
      <text x="34" y="101" fill="#a7c7d9" font-size="21">touches named files</text>
      <text x="34" y="132" fill="#a7c7d9" font-size="21">runs focused checks</text>
      <text x="34" y="163" fill="#a7c7d9" font-size="21">returns small diff</text>
    </g>
  </g>

  <path d="M420 365 H500" fill="none" stroke="#9bdcff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M910 365 H990" fill="none" stroke="#9bdcff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(626 545)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M112 0 L224 74 L184 208 H40 L0 74 Z" fill="url(#warning)" opacity="0.95" filter="url(#soft)"/>
    <path d="M108 38 L145 96 H112 L137 169 L68 82 H106 Z" fill="#07111f" opacity="0.88"/>
    <text x="282" y="69" fill="#fff4cc" font-size="32" font-weight="900">quota fuse</text>
    <text x="282" y="112" fill="#d8cda9" font-size="22">stop before exploration turns into churn</text>
    <text x="282" y="145" fill="#d8cda9" font-size="22">return a compact, reusable result</text>
  </g>

  <g transform="translate(118 724)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="1364" height="82" rx="18" fill="#07111f" stroke="#24465d"/>
    <text x="34" y="51" fill="#dffcff" font-size="25" font-weight="800">Rule:</text>
    <text x="108" y="51" fill="#b8d8e8" font-size="25">fast lead + strong delegate beats the strongest model doing everything</text>
  </g>
</svg>
