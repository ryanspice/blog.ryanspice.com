<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">From pocket to meeting</title><desc id="desc">Android captures and encrypts audio. UDP carries it over a private LAN. Windows authenticates, decrypts and buffers it. A virtual cable supplies the meeting microphone. Only the phone to receiver hop is PocketMic encrypted transport.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#dcb66b"/></marker></defs><rect width="900" height="690" rx="24" fill="#111b26"/><g font-family="system-ui,sans-serif"><text x="40" y="53" fill="#dcb66b" font-size="15" letter-spacing="3">POCKETMIC LAN / SIGNAL PATH</text><text x="40" y="99" fill="#f6f2e9" font-size="34" font-weight="700">From pocket to meeting</text>
<g fill="#1e3040" stroke="#526472"><rect x="40" y="140" width="820" height="95" rx="14"/><rect x="40" y="290" width="820" height="95" rx="14"/><rect x="40" y="440" width="390" height="95" rx="14"/><rect x="470" y="440" width="390" height="95" rx="14"/></g>
<g fill="#f6f2e9" font-size="24" font-weight="650"><text x="65" y="178">01 / Android phone</text><text x="65" y="328">02 / Windows receiver</text><text x="65" y="478">03 / Virtual cable</text><text x="495" y="478">04 / Meeting app</text></g>
<g fill="#c0cdd5" font-size="19"><text x="65" y="211">Capture → 10 ms PCM frames → AES-GCM encryption</text><text x="65" y="361">Authenticate → decrypt → buffer → selected output</text><text x="65" y="511">CABLE Input → CABLE Output</text><text x="495" y="511">Select cable as microphone</text></g>
<g stroke="#dcb66b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M95 240V281"/><path d="M95 390V431"/><path d="M435 486H462"/></g><g fill="#dcb66b" font-size="18"><text x="120" y="268">Encrypted UDP / private LAN</text><text x="120" y="419">Decrypted audio / local Windows routing</text></g>
<path d="M40 574H860" stroke="#526472"/><g fill="#c0cdd5" font-size="19"><text x="40" y="611">PocketMic does not relay this LAN hop through a cloud service.</text><text x="40" y="643">An online meeting app still handles its own outgoing audio.</text></g></g></svg>
