<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Memory unification audit loop</title>
  <desc id="desc">A shared memory store connects three workbenches through read pointers, then a different model verifies bridge edits and a human audit catches the remaining wiring defect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.55" stop-color="#101c18"/>
      <stop offset="1" stop-color="#211b0f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7ad39d"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="112" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">The Real Win: Verify, Then Audit</text>
  <text x="98" y="158" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="24">The autonomous run did most of the work; the review loop caught the bridge defect before trust.</text>

  <g filter="url(#shadow)">
    <rect x="585" y="260" width="430" height="210" rx="30" fill="#14251f" stroke="#d5b35f" stroke-width="3"/>
    <text x="800" y="328" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Shared Memory Store</text>
    <text x="800" y="372" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="21">one fact per file + one index</text>
    <text x="800" y="414" text-anchor="middle" fill="#a3e635" font-family="Segoe UI, Arial, sans-serif" font-size="21">read-pointer phase only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="288" width="300" height="120" rx="20" fill="#10241f" stroke="#7ad39d" stroke-width="2"/>
    <text x="270" y="340" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Workbench A</text>
    <text x="270" y="374" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="19">read pointer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="520" width="300" height="120" rx="20" fill="#10241f" stroke="#38bdf8" stroke-width="2"/>
    <text x="270" y="572" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Workbench B</text>
    <text x="270" y="606" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="19">read pointer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1180" y="288" width="300" height="120" rx="20" fill="#10241f" stroke="#a3e635" stroke-width="2"/>
    <text x="1330" y="340" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Workbench C</text>
    <text x="1330" y="374" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="19">read pointer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1180" y="520" width="300" height="120" rx="20" fill="#10241f" stroke="#facc15" stroke-width="2"/>
    <text x="1330" y="572" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Verifier</text>
    <text x="1330" y="606" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="19">different model family</text>
  </g>

  <path d="M 420 348 C 494 336 525 325 578 340" fill="none" stroke="#7ad39d" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 420 580 C 500 554 540 500 584 430" fill="none" stroke="#7ad39d" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1016 340 C 1084 326 1120 336 1174 348" fill="none" stroke="#7ad39d" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1016 430 C 1080 500 1118 554 1174 580" fill="none" stroke="#7ad39d" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="458" y="704" width="684" height="96" rx="22" fill="#0f1f1b" stroke="#d5b35f" stroke-width="2"/>
    <text x="800" y="744" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Human audit caught the remaining wiring bug</text>
    <text x="800" y="780" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="20">bounded automation is useful because review is built in, not skipped</text>
  </g>
</svg>
