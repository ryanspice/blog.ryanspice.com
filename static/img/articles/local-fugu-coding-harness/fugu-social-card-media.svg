<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Social card diagram for the local Fugu harness</title>
  <desc id="desc">A central conductor node routes to thinker, worker, verifier, and local queue nodes, then returns one reviewed result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06110f"/>
      <stop offset="0.6" stop-color="#10221d"/>
      <stop offset="1" stop-color="#1d2812"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d5b35f"/>
    </marker>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="850" cy="120" r="260" fill="#a3e635" opacity="0.08"/>
  <circle cx="115" cy="855" r="300" fill="#38bdf8" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="260" y="345" width="480" height="220" rx="34" fill="#13251f" stroke="#d5b35f" stroke-width="4"/>
    <text x="500" y="420" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Conductor</text>
    <text x="500" y="465" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="24">routes, owns scope</text>
    <text x="500" y="512" text-anchor="middle" fill="#a3e635" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">never self-verifies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="150" width="280" height="120" rx="24" fill="#10241f" stroke="#7ad39d" stroke-width="3"/>
    <text x="220" y="222" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Thinker</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="610" width="280" height="120" rx="24" fill="#10241f" stroke="#38bdf8" stroke-width="3"/>
    <text x="220" y="682" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Workers</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="150" width="280" height="120" rx="24" fill="#10241f" stroke="#facc15" stroke-width="3"/>
    <text x="780" y="222" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Verifier</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="610" width="280" height="120" rx="24" fill="#10241f" stroke="#a3e635" stroke-width="3"/>
    <text x="780" y="682" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Local Queue</text>
  </g>

  <path d="M 320 270 C 365 320 392 338 432 354" fill="none" stroke="#d5b35f" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M 320 610 C 368 590 396 570 432 552" fill="none" stroke="#d5b35f" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M 680 270 C 636 320 608 338 568 354" fill="none" stroke="#d5b35f" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M 680 610 C 634 590 604 570 568 552" fill="none" stroke="#d5b35f" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="230" y="880" width="540" height="62" rx="18" fill="#0f1f1b" stroke="#bed7c9" stroke-width="2"/>
    <text x="500" y="920" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">one reviewed result</text>
  </g>
</svg>
