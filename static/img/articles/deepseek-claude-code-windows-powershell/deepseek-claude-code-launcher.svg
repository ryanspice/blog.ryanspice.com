<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Claude Code PowerShell launcher diagram</title>
  <desc id="desc">A Windows PowerShell launcher sets Claude Code environment variables and routes requests to DeepSeek's Anthropic-compatible API endpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#10233f"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172b46"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02060c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 560 C170 500 275 610 430 550 C590 488 680 490 835 548 C990 607 1060 520 1200 565 L1200 675 L0 675 Z" fill="#0a1b2d"/>
  <circle cx="1048" cy="124" r="74" fill="#1e9bff" opacity="0.13"/>
  <circle cx="156" cy="540" r="96" fill="#8ae9ff" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="78" y="86" width="476" height="396" rx="22" fill="url(#panel)" stroke="#2a5f93" stroke-width="2"/>
    <rect x="78" y="86" width="476" height="52" rx="22" fill="#0d2138"/>
    <circle cx="116" cy="112" r="8" fill="#ff6b6b"/>
    <circle cx="144" cy="112" r="8" fill="#ffd166"/>
    <circle cx="172" cy="112" r="8" fill="#06d6a0"/>
    <text x="208" y="119" fill="#9fd7ff" font-family="Consolas, monospace" font-size="20">PowerShell launcher</text>

    <text x="116" y="184" fill="#c8f1ff" font-family="Consolas, monospace" font-size="28">$env:ANTHROPIC_BASE_URL</text>
    <text x="116" y="229" fill="#7ed7ff" font-family="Consolas, monospace" font-size="24">https://api.deepseek.com/anthropic</text>
    <text x="116" y="291" fill="#c8f1ff" font-family="Consolas, monospace" font-size="28">$env:ANTHROPIC_MODEL</text>
    <text x="116" y="336" fill="#7ed7ff" font-family="Consolas, monospace" font-size="24">deepseek-v4-pro[1m]</text>
    <text x="116" y="398" fill="#c8f1ff" font-family="Consolas, monospace" font-size="28">$env:SUBAGENT_MODEL</text>
    <text x="116" y="443" fill="#7ed7ff" font-family="Consolas, monospace" font-size="24">deepseek-v4-flash</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="730" y="120" width="360" height="318" rx="28" fill="#071a2e" stroke="#36c4ff" stroke-width="2"/>
    <text x="780" y="186" fill="#dff8ff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Claude Code</text>
    <text x="780" y="232" fill="#8ccff4" font-family="Consolas, monospace" font-size="24">claude</text>
    <rect x="780" y="270" width="252" height="52" rx="12" fill="#102a46" stroke="#245b83"/>
    <text x="804" y="304" fill="#d3f6ff" font-family="Consolas, monospace" font-size="20">read-only smoke test</text>
    <rect x="780" y="346" width="252" height="52" rx="12" fill="#102a46" stroke="#245b83"/>
    <text x="804" y="380" fill="#d3f6ff" font-family="Consolas, monospace" font-size="20">scoped env vars</text>
  </g>

  <path d="M568 282 H710" fill="none" stroke="#67d8ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M693 254 L730 282 L693 310 Z" fill="#67d8ff"/>
  <text x="589" y="252" fill="#bcefff" font-family="Segoe UI, Arial, sans-serif" font-size="22">route only this process</text>

  <g>
    <rect x="418" y="532" width="364" height="58" rx="29" fill="#08243a" stroke="#2a6f9e"/>
    <text x="457" y="569" fill="#dff8ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Keep keys out of commits</text>
  </g>
</svg>
