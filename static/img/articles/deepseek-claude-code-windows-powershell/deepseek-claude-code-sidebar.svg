<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Claude Code sidebar card</title>
  <desc id="desc">A vertical Windows PowerShell console card showing Claude Code routed through a scoped launcher to DeepSeek.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.46" stop-color="#0d2742"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <linearGradient id="console" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172c48"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e9bff"/>
      <stop offset="1" stop-color="#55f0d3"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#02060c" flood-opacity="0.46"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#grid)"/>
  <circle cx="754" cy="164" r="128" fill="#1e9bff" opacity="0.13"/>
  <circle cx="150" cy="1000" r="170" fill="#55f0d3" opacity="0.08"/>
  <path d="M0 1008 C144 936 235 1110 384 1020 C545 923 658 982 900 892 V1200 H0 Z" fill="#05101b" opacity="0.78"/>

  <g filter="url(#shadow)">
    <rect x="96" y="122" width="708" height="690" rx="34" fill="url(#console)" stroke="#2f75aa" stroke-width="2"/>
    <rect x="96" y="122" width="708" height="72" rx="34" fill="#091d33"/>
    <path d="M96 160 C96 139 113 122 134 122 H766 C787 122 804 139 804 160 V194 H96 Z" fill="#0b2138"/>
    <circle cx="147" cy="158" r="11" fill="#ff6b6b"/>
    <circle cx="184" cy="158" r="11" fill="#ffd166"/>
    <circle cx="221" cy="158" r="11" fill="#06d6a0"/>
    <text x="267" y="168" fill="#bfeeff" font-family="Consolas, monospace" font-size="27">launch-claude-deepseek.ps1</text>

    <text x="150" y="270" fill="#e6fbff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Scoped Claude Code</text>
    <text x="150" y="316" fill="#87d7ff" font-family="Segoe UI, Arial, sans-serif" font-size="26">Windows PowerShell to DeepSeek</text>

    <g font-family="Consolas, monospace" font-size="28">
      <text x="150" y="408" fill="#8ae9ff">$env:ANTHROPIC_BASE_URL</text>
      <text x="150" y="452" fill="#d8f7ff">api.deepseek.com/anthropic</text>
      <text x="150" y="532" fill="#8ae9ff">$env:ANTHROPIC_MODEL</text>
      <text x="150" y="576" fill="#d8f7ff">deepseek-v4-pro[1m]</text>
      <text x="150" y="656" fill="#8ae9ff">$env:SUBAGENT_MODEL</text>
      <text x="150" y="700" fill="#d8f7ff">deepseek-v4-flash</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="162" y="850" width="576" height="184" rx="32" fill="#071827" stroke="#35c6ff" stroke-width="2"/>
    <rect x="210" y="908" width="156" height="68" rx="18" fill="#0f2a43" stroke="#2c628a"/>
    <text x="245" y="951" fill="#dff8ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">claude</text>
    <path d="M390 942 H510" fill="none" stroke="#55f0d3" stroke-width="8" stroke-linecap="round"/>
    <path d="M496 918 L533 942 L496 966 Z" fill="#55f0d3"/>
    <rect x="552" y="908" width="136" height="68" rx="18" fill="url(#chip)"/>
    <text x="579" y="951" fill="#04111f" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">API</text>
  </g>

  <g opacity="0.95">
    <rect x="254" y="1074" width="392" height="58" rx="29" fill="#08243a" stroke="#2a6f9e"/>
    <text x="299" y="1112" fill="#dff8ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Key stays out of the repo</text>
  </g>
</svg>
