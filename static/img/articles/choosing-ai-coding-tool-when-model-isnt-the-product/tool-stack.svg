<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" rx="32" fill="url(#bg)"/>
  <text x="450" y="90" text-anchor="middle" font-size="42" font-weight="700" fill="#f1f5f9">What are you actually choosing?</text>
  <text x="450" y="140" text-anchor="middle" font-size="24" fill="#94a3b8">An AI coding stack, layer by layer</text>

  <!-- Band 5: repository/tools (top) -->
  <g>
    <rect x="70" y="190" width="760" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="190" width="760" height="46" rx="20" fill="#334155"/>
    <text x="100" y="220" font-size="26" font-weight="700" fill="#e2e8f0">Layer 5 — repository / tools</text>
    <text x="450" y="285" text-anchor="middle" font-size="24" fill="#cbd5e1">your repo, files, permissions, MCP servers, hooks</text>
    <path d="M450 352 L450 366" stroke="#38bdfa" stroke-width="6"/>
  </g>

  <!-- Band 4: control surface -->
  <g>
    <rect x="70" y="370" width="760" height="150" rx="20" fill="url(#surface)" stroke="#38bdfa" stroke-width="3"/>
    <rect x="70" y="370" width="760" height="46" rx="20" fill="#0e7490"/>
    <text x="100" y="400" font-size="26" font-weight="700" fill="#e0f2fe">Layer 4 — control surface</text>
    <text x="450" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">T3 Code</text>
    <path d="M450 532 L450 546" stroke="#38bdfa" stroke-width="6"/>
  </g>

  <!-- Band 3: harness/runtime -->
  <g>
    <rect x="70" y="550" width="760" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="550" width="760" height="46" rx="20" fill="#334155"/>
    <text x="100" y="580" font-size="26" font-weight="700" fill="#e2e8f0">Layer 3 — harness / runtime</text>
    <text x="450" y="650" text-anchor="middle" font-size="24" fill="#cbd5e1">Claude Code · Codex CLI · Hermes · OpenCode</text>
    <path d="M450 712 L450 726" stroke="#38bdfa" stroke-width="6"/>
  </g>

  <!-- Band 2: compatibility/routing -->
  <g>
    <rect x="70" y="730" width="760" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="730" width="760" height="46" rx="20" fill="#334155"/>
    <text x="100" y="760" font-size="26" font-weight="700" fill="#e2e8f0">Layer 2 — compatibility / routing</text>
    <text x="450" y="830" text-anchor="middle" font-size="24" fill="#cbd5e1">Hermes lanes · AgentRouter · OpenCode routes</text>
    <path d="M450 892 L450 906" stroke="#38bdfa" stroke-width="6"/>
  </g>

  <!-- Band 1: model/provider -->
  <g>
    <rect x="70" y="910" width="760" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="910" width="760" height="46" rx="20" fill="#334155"/>
    <text x="100" y="940" font-size="26" font-weight="700" fill="#e2e8f0">Layer 1 — model / provider</text>
    <text x="450" y="1010" text-anchor="middle" font-size="24" fill="#cbd5e1">DeepSeek · GLM-5.2 · Nemotron · MiMo · Claude · GPT</text>
  </g>

  <text x="450" y="1120" text-anchor="middle" font-size="22" fill="#64748b">A model benchmark measures layer 1.</text>
  <text x="450" y="1156" text-anchor="middle" font-size="22" fill="#64748b">The other four decide which tool you actually open.</text>
</svg>
