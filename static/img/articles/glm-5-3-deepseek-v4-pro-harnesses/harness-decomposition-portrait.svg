<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">DeepSWE v1.1 — one benchmark name, different experiments</title>
  <desc id="desc">Portrait diagram showing how the same public benchmark task set flows through different harness configurations and runners, producing different scores for the same model name: GLM-5.2 at 46.2 on a vendor run versus 44 plus or minus 2 on an independent mini-swe-agent run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b8a"/>
    </marker>
  </defs>

  <rect width="1024" height="1536" rx="28" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="1456" rx="22" fill="#0b1928" stroke="#28445b"/>

  <text x="70" y="106" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">One benchmark name, four different records</text>
  <text x="70" y="142" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">DeepSWE v1.1 · the same public task set can be run very differently</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="190" width="884" height="260" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="232" fill="#48c5d6" font-size="22" font-weight="700">1 · Public task set</text>
    <text x="96" y="282" fill="#f8fafc" font-size="24" font-weight="600">DeepSWE v1.1</text>
    <text x="96" y="316" fill="#a8bed0" font-size="19">Real-world GitHub issues.</text>
    <text x="96" y="344" fill="#a8bed0" font-size="19">Identical task list for</text>
    <text x="96" y="372" fill="#a8bed0" font-size="19">every runner below.</text>
    <text x="96" y="428" fill="#7894aa" font-size="16">The name is the same.</text>
    <text x="96" y="452" fill="#7894aa" font-size="16">The experiment is not.</text>

    <line x1="512" y1="462" x2="512" y2="488" stroke="#3d6b8a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="70" y="500" width="884" height="300" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="542" fill="#48c5d6" font-size="22" font-weight="700">2 · Harness configuration</text>
    <text x="96" y="592" fill="#f8fafc" font-size="19">Agent: mini-swe-agent / Claude Code</text>
    <text x="96" y="622" fill="#f8fafc" font-size="19">temperature 0.95 · top_p 1.0</text>
    <text x="96" y="652" fill="#f8fafc" font-size="19">timeout: 6–10 hours per task</text>
    <text x="96" y="682" fill="#f8fafc" font-size="19">context: 400K–1M tokens</text>
    <text x="96" y="712" fill="#f8fafc" font-size="19">rollouts: 1–3 per task</text>
    <text x="96" y="742" fill="#f8fafc" font-size="19">max output: 128K tokens</text>

    <line x1="512" y1="812" x2="512" y2="838" stroke="#3d6b8a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="70" y="850" width="884" height="260" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="892" fill="#48c5d6" font-size="22" font-weight="700">3 · Who ran it</text>
    <rect x="96" y="922" width="230" height="40" rx="10" fill="#5b3a21"/>
    <text x="122" y="948" fill="#f8fafc" font-size="19">Z.ai — vendor</text>
    <rect x="96" y="978" width="260" height="40" rx="10" fill="#253252"/>
    <text x="122" y="1004" fill="#f8fafc" font-size="19">Independent leaderboard</text>
    <rect x="96" y="1034" width="266" height="40" rx="10" fill="#1c3d33"/>
    <text x="122" y="1060" fill="#f8fafc" font-size="19">Official evaluation service</text>
    <text x="96" y="1108" fill="#7894aa" font-size="16">A score's weight depends</text>
    <text x="96" y="1130" fill="#7894aa" font-size="16">on this column.</text>

    <line x1="512" y1="1122" x2="512" y2="1148" stroke="#3d6b8a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="70" y="1160" width="884" height="240" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="1202" fill="#f8fafc" font-size="22" font-weight="700">The same model name can carry two scores</text>
    <text x="96" y="1244" fill="#f8fafc" font-size="19">GLM-5.2 <tspan fill="#48c5d6" font-weight="700">46.2</tspan> (Z.ai run) · <tspan fill="#8f9fff" font-weight="700">44 ± 2</tspan> (independent, mini-swe-agent)</text>
    <text x="96" y="1284" fill="#f8fafc" font-size="19">GLM-5.3 <tspan fill="#48c5d6" font-weight="700">66.9</tspan> (Z.ai run) · independent record pending at publication</text>
    <line x1="96" y1="1310" x2="928" y2="1310" stroke="#28445b"/>
    <text x="96" y="1342" fill="#a8bed0" font-size="18">Benchmark names identify the task set — not the experiment that measured it.</text>
  </g>

  <text x="70" y="1422" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">Harness and runner labels follow Z.ai's GLM-5.3 launch notes (2026-08-14) and the DeepSWE v1.1 independent leaderboard.</text>
  <text x="70" y="1446" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">Original portrait diagram for this article.</text>
</svg>
