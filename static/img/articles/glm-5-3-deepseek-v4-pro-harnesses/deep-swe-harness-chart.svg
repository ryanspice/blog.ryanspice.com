<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">DeepSWE v1.1 scores with who-ran-it labels</title>
  <desc id="desc">Horizontal bar chart of DeepSWE v1.1 scores: Kimi K3 at 67.5 (vendor-run, Z.ai table), GLM-5.3 at 66.9 (Z.ai run, independent pending), DeepSeek V4 Pro 0813 at 62.7 (vendor-reported), GLM-5.2 at 46.2 (Z.ai run) with an independent mini-swe-agent record of 44 plus or minus 2 shown as a thin strip.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <linearGradient id="kimi" x1="0" x2="1">
      <stop offset="0" stop-color="#f4c273"/>
      <stop offset="1" stop-color="#f59e69"/>
    </linearGradient>
    <linearGradient id="glm" x1="0" x2="1">
      <stop offset="0" stop-color="#48c5d6"/>
      <stop offset="1" stop-color="#2f9bc2"/>
    </linearGradient>
    <linearGradient id="deepseek" x1="0" x2="1">
      <stop offset="0" stop-color="#8f9fff"/>
      <stop offset="1" stop-color="#6678e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <rect x="48" y="44" width="1104" height="732" rx="22" fill="#0b1928" stroke="#28445b"/>

  <text x="92" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">DeepSWE v1.1 — who ran the number</text>
  <text x="92" y="152" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="20">Bars are vendor-run records · thin strip = independent run</text>

  <g stroke="#294258" stroke-width="1">
    <line x1="451" y1="210" x2="451" y2="600"/>
    <line x1="553" y1="210" x2="553" y2="600"/>
    <line x1="654" y1="210" x2="654" y2="600"/>
    <line x1="756" y1="210" x2="756" y2="600"/>
    <line x1="857" y1="210" x2="857" y2="600"/>
    <line x1="959" y1="210" x2="959" y2="600"/>
    <line x1="1060" y1="210" x2="1060" y2="600"/>
  </g>
  <g fill="#7290a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="350" y="686">0</text>
    <text x="451" y="686">10</text>
    <text x="553" y="686">20</text>
    <text x="654" y="686">30</text>
    <text x="756" y="686">40</text>
    <text x="857" y="686">50</text>
    <text x="959" y="686">60</text>
    <text x="1060" y="686">70</text>
  </g>

  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    <text x="100" y="278">Kimi K3</text>
    <text x="100" y="398">GLM-5.3</text>
    <text x="100" y="518">DeepSeek V4 Pro</text>
    <text x="100" y="638">GLM-5.2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="240" width="684" height="54" rx="12" fill="url(#kimi)"/>
    <rect x="350" y="360" width="678" height="54" rx="12" fill="url(#glm)"/>
    <rect x="350" y="480" width="636" height="54" rx="12" fill="url(#deepseek)"/>
    <rect x="350" y="600" width="468" height="54" rx="12" fill="url(#glm)" opacity="0.55"/>
  </g>
  <g fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">
    <text x="1056" y="277">67.5</text>
    <text x="1050" y="397">66.9</text>
    <text x="1008" y="517">62.7</text>
    <text x="840" y="637">46.2</text>
  </g>
  <g fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    <text x="92" y="228" fill="#f4c273">vendor-run · Z.ai table</text>
    <text x="92" y="348" fill="#48c5d6">Z.ai run · independent pending</text>
    <text x="92" y="468" fill="#8f9fff">vendor-reported · DeepSeek V4 Pro 0813 GA</text>
    <text x="92" y="588" fill="#48c5d6">Z.ai run · independent strip below</text>
  </g>

  <rect x="350" y="662" width="446" height="8" rx="4" fill="#8f9fff" opacity="0.85"/>
  <text x="806" y="704" fill="#8f9fff" font-family="Segoe UI, Arial, sans-serif" font-size="16">independent mini-swe-agent: 44 ± 2</text>

  <text x="92" y="724" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">Independent runs use mini-swe-agent; Z.ai's 5.3 run uses temperature 0.95, six-hour timeouts,</text>
  <text x="92" y="746" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">400K context. Scores are not comparable across runners. Source: Z.ai launch notes (2026-08-14),</text>
  <text x="92" y="768" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">DeepSWE v1.1 leaderboard, DeepSeek GA notes (2026-08-12). Redrawn for this article.</text>
</svg>
