<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 Pro integration paths</title>
  <desc id="desc">Portrait diagram of four DeepSeek V4 Pro integration surfaces — Claude Code, Hermes, direct API, OpenRouter — and the two shared rules that apply on every surface: reasoning effort max on agent lanes, thinking enabled with temperature 1.0.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <linearGradient id="ds" x1="0" x2="1">
      <stop offset="0" stop-color="#8f9fff"/>
      <stop offset="1" stop-color="#6678e8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1536" rx="28" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="1456" rx="22" fill="#0b1928" stroke="#28445b"/>

  <text x="70" y="106" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">DeepSeek V4 Pro — integration paths</text>
  <text x="70" y="142" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">The model is portable; the two shared rules travel with it</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="190" width="884" height="240" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="232" fill="#8f9fff" font-size="22" font-weight="700">Claude Code</text>
    <text x="96" y="280" fill="#f8fafc" font-size="19">Anthropic-compatible endpoint</text>
    <text x="96" y="310" fill="#a8bed0" font-size="19">1M context · effort via env config</text>
    <text x="96" y="340" fill="#a8bed0" font-size="19">Discipline prefix as first user message —</text>
    <text x="96" y="370" fill="#a8bed0" font-size="19">not in CLAUDE.md, so subagents</text>
    <text x="96" y="400" fill="#a8bed0" font-size="19">keep the compact prompt</text>

    <rect x="70" y="460" width="884" height="240" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="502" fill="#8f9fff" font-size="22" font-weight="700">Hermes</text>
    <text x="96" y="550" fill="#f8fafc" font-size="19">Profiles hold provider + effort</text>
    <text x="96" y="580" fill="#a8bed0" font-size="19">SOUL.md carries lead discipline</text>
    <text x="96" y="610" fill="#a8bed0" font-size="19">hermes -p &lt;profile&gt; chat = fresh lead:</text>
    <text x="96" y="640" fill="#a8bed0" font-size="19">it injects SOUL/AGENTS/memory — workers</text>
    <text x="96" y="670" fill="#a8bed0" font-size="19">call with --ignore-rules</text>

    <rect x="70" y="730" width="884" height="170" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="772" fill="#8f9fff" font-size="22" font-weight="700">Direct API</text>
    <text x="96" y="816" fill="#f8fafc" font-size="19">OpenAI-compatible · thinking enabled</text>
    <text x="96" y="846" fill="#a8bed0" font-size="19">temperature 1.0 · reasoning_effort max</text>

    <rect x="70" y="930" width="884" height="170" rx="16" fill="#0d1f31" stroke="#2c4a63"/>
    <text x="96" y="972" fill="#8f9fff" font-size="22" font-weight="700">OpenRouter</text>
    <text x="96" y="1016" fill="#f8fafc" font-size="19">deepseek/deepseek-v4-pro-0813 (GA)</text>
    <text x="96" y="1046" fill="#a8bed0" font-size="19">cache-read $0.0036/M · prefix caching</text>
  </g>

  <rect x="70" y="1180" width="884" height="92" rx="14" fill="url(#ds)"/>
  <text x="96" y="1218" fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Two rules everywhere: reasoning_effort max</text>
  <text x="96" y="1250" fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">on agent lanes · thinking stays enabled, temperature 1.0</text>

  <text x="70" y="1340" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">Personal operating reference, not vendor documentation.</text>
  <text x="70" y="1364" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">Original portrait diagram for this article.</text>
</svg>
