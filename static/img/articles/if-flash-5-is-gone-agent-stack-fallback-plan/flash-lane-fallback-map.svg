<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Flash lane fallback routing map</title>
  <desc id="desc">A routing diagram showing GPT-5.5 and Hermes as lead, Claude Code as premium implementation, DeepSeek Pro as reasoning delegate, Gemma4 as local sanity check, and the Flash lane as optional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#53b8ff"/>
      <stop offset="1" stop-color="#f2d27c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#91c8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="44" y="44" width="1112" height="632" rx="24" fill="#0d1626" stroke="#27364d" stroke-width="2"/>

  <text x="80" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">When the cheap Flash lane disappears</text>
  <text x="80" y="132" fill="#aab7cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Treat model names as replaceable implementations of stable routing jobs.</text>
  <rect x="80" y="154" width="440" height="4" fill="url(#accent)" rx="2"/>

  <g filter="url(#shadow)">
    <rect x="455" y="190" width="290" height="118" rx="14" fill="#142033" stroke="#53b8ff" stroke-width="2"/>
    <text x="600" y="232" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Lead / Router</text>
    <text x="600" y="264" text-anchor="middle" fill="#b9c7dd" font-family="Segoe UI, Arial, sans-serif" font-size="17">GPT-5.5 + Hermes</text>
    <text x="600" y="288" text-anchor="middle" fill="#7fa8d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">scope, context, synthesis, final decision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="405" width="250" height="112" rx="14" fill="#1f2937" stroke="#f2d27c" stroke-width="2"/>
    <text x="215" y="446" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Premium Code</text>
    <text x="215" y="478" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="16">Claude Code / Opus lane</text>
    <text x="215" y="501" text-anchor="middle" fill="#aab7cc" font-family="Segoe UI, Arial, sans-serif" font-size="13">repo edits, debugging, final review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="385" y="405" width="250" height="112" rx="14" fill="#172338" stroke="#7c5cff" stroke-width="2"/>
    <text x="510" y="446" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Reasoning</text>
    <text x="510" y="478" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="16">DeepSeek Pro</text>
    <text x="510" y="501" text-anchor="middle" fill="#aab7cc" font-family="Segoe UI, Arial, sans-serif" font-size="13">second opinions, ambiguity, judgment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="405" width="250" height="112" rx="14" fill="#132a26" stroke="#87dac4" stroke-width="2"/>
    <text x="805" y="446" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Local Sanity</text>
    <text x="805" y="478" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="16">Gemma4</text>
    <text x="805" y="501" text-anchor="middle" fill="#aab7cc" font-family="Segoe UI, Arial, sans-serif" font-size="13">visual review, scope-risk spotter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="390" width="170" height="142" rx="14" fill="#2b1f23" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1035" y="431" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Cheap Lane</text>
    <text x="1035" y="463" text-anchor="middle" fill="#ffd3d3" font-family="Segoe UI, Arial, sans-serif" font-size="15">Flash optional</text>
    <text x="1035" y="488" text-anchor="middle" fill="#e8b4b4" font-family="Segoe UI, Arial, sans-serif" font-size="13">feature-detect</text>
    <text x="1035" y="511" text-anchor="middle" fill="#e8b4b4" font-family="Segoe UI, Arial, sans-serif" font-size="13">never assume</text>
  </g>

  <path d="M 545 310 C 440 350 310 358 225 400" fill="none" stroke="#91c8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 585 310 C 550 350 528 365 514 400" fill="none" stroke="#91c8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 645 310 C 700 350 760 364 801 400" fill="none" stroke="#91c8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 715 285 C 850 320 970 338 1030 386" fill="none" stroke="#ffaaaa" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <rect x="137" y="578" width="926" height="52" rx="12" fill="#0b1220" stroke="#27364d"/>
  <text x="600" y="611" text-anchor="middle" fill="#dbe7f5" font-family="Segoe UI, Arial, sans-serif" font-size="18">Fallback principle: replace the model name with a role, then route by risk.</text>
</svg>
