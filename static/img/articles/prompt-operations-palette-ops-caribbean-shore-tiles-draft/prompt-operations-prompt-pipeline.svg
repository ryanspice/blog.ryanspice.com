<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Operations pipeline for shore palettes</title>
  <desc id="desc">Flow diagram covering contract setup, generation, CI validation, human review, and release gates for indexed shore palettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081624"/>
      <stop offset="60%" stop-color="#0a2038"/>
      <stop offset="100%" stop-color="#102f22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="58" y="72" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Prompt Operations Pipeline</text>
  <text x="58" y="108" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">From document contract to CI-gated production release</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="64" y="156" width="196" height="120" rx="16" fill="#08203a" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="192" fill="#cffafe" font-size="20" font-weight="700">01 Source Context</text>
    <text x="90" y="218" fill="#bae6fd" font-size="14">Prompt contract loaded</text>
    <text x="90" y="238" fill="#bae6fd" font-size="14">Template + risk tier</text>
    <text x="90" y="258" fill="#bae6fd" font-size="14">Output mode</text>
    <text x="90" y="278" fill="#bae6fd" font-size="14">Schema + reviewers</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="316" y="156" width="196" height="120" rx="16" fill="#0f2542" stroke="#fbbf24" stroke-width="2"/>
    <text x="348" y="192" fill="#fde68a" font-size="20" font-weight="700">02 Prompt Build</text>
    <text x="348" y="218" fill="#fde68a" font-size="14">Model route selected</text>
    <text x="348" y="238" fill="#fde68a" font-size="14">Palette IDs declared</text>
    <text x="348" y="258" fill="#fde68a" font-size="14">Reserved indices fixed</text>
    <text x="348" y="278" fill="#fde68a" font-size="14">Seeded with source intent</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="568" y="156" width="196" height="120" rx="16" fill="#0f2f1f" stroke="#34d399" stroke-width="2"/>
    <text x="600" y="192" fill="#d1fae5" font-size="20" font-weight="700">03 Validate</text>
    <text x="600" y="218" fill="#a7f3d0" font-size="14">Index manifest checked</text>
    <text x="600" y="238" fill="#a7f3d0" font-size="14">Only allowed colors</text>
    <text x="600" y="258" fill="#a7f3d0" font-size="14">No lossy runtime path</text>
    <text x="600" y="278" fill="#a7f3d0" font-size="14">PNG integrity verified</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="820" y="156" width="196" height="120" rx="16" fill="#351a2f" stroke="#f472b6" stroke-width="2"/>
    <text x="852" y="192" fill="#fbcfe8" font-size="20" font-weight="700">04 Human Review</text>
    <text x="852" y="218" fill="#f9a8d4" font-size="14">Visual gate for readability</text>
    <text x="852" y="238" fill="#f9a8d4" font-size="14">Shoreline silhouette checks</text>
    <text x="852" y="258" fill="#f9a8d4" font-size="14">Shader assumptions confirmed</text>
    <text x="852" y="278" fill="#f9a8d4" font-size="14">Release rule passed</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="1012" y="156" width="168" height="120" rx="16" fill="#123b3b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="1038" y="192" fill="#cffafe" font-size="20" font-weight="700">05 Promote</text>
    <text x="1038" y="218" fill="#99f6e4" font-size="14">Manifest freeze</text>
    <text x="1038" y="238" fill="#99f6e4" font-size="14">SemVer update</text>
    <text x="1038" y="258" fill="#99f6e4" font-size="14">Publish artifact</text>
  </g>

  <line x1="260" y1="216" x2="316" y2="216" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="512" y1="216" x2="568" y2="216" stroke="#fef08a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="764" y1="216" x2="820" y2="216" stroke="#6ee7b7" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1016" y1="216" x2="1180" y2="216" stroke="#2dd4bf" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="112" y="340" width="196" height="120" rx="16" fill="#0f3c53" stroke="#7dd3fc" stroke-width="2"/>
    <text x="144" y="376" fill="#cffafe" font-size="20" font-weight="700">Artifacts</text>
    <text x="144" y="402" fill="#bae6fd" font-size="14">PNG, JSON, and release note</text>
    <text x="144" y="422" fill="#bae6fd" font-size="14">Schema package</text>
    <text x="144" y="442" fill="#bae6fd" font-size="14">Validator output</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="424" y="340" width="196" height="120" rx="16" fill="#3d1f2b" stroke="#fda4af" stroke-width="2"/>
    <text x="456" y="376" fill="#ffe4e6" font-size="20" font-weight="700">Gate Log</text>
    <text x="456" y="402" fill="#fecdd3" font-size="14">CI evidence attached</text>
    <text x="456" y="422" fill="#fecdd3" font-size="14">Reviewer decisions</text>
    <text x="456" y="442" fill="#fecdd3" font-size="14">Pass/fail history</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" filter="url(#glow)">
    <rect x="736" y="340" width="196" height="120" rx="16" fill="#1a2f2f" stroke="#34d399" stroke-width="2"/>
    <text x="768" y="376" fill="#d1fae5" font-size="20" font-weight="700">Ship</text>
    <text x="768" y="402" fill="#a7f3d0" font-size="14">Runtime-safe release</text>
    <text x="768" y="422" fill="#a7f3d0" font-size="14">Engine handoff</text>
    <text x="768" y="442" fill="#a7f3d0" font-size="14">Next iteration begins</text>
  </g>

  <line x1="320" y1="400" x2="424" y2="400" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="620" y1="400" x2="736" y2="400" stroke="#f9a8d4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M834 340 C834 300, 130 300, 130 260" fill="none" stroke="#fef08a" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="560" y="470" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A contract is only complete after pipeline gates and release evidence are both complete.</text>
</svg>
</svg>
