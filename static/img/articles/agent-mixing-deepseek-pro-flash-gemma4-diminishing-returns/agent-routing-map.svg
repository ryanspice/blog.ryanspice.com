<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1600 900">
  <title>Agent routing map for DeepSeek Pro, DeepSeek Flash, and Gemma4</title>
  <desc>DeepSeek Pro sits in the center as lead orchestrator. DeepSeek Flash delegates handle implementation, regression risk, context packing, and alternative design. Gemma4 provides a local junior engineer sanity pass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0d2035"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gemma" x1="0" x2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8bd3ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.17" stroke="#9ccfff" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>

  <text x="80" y="92" fill="#e5f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Agent mixing without theater</text>
  <text x="82" y="136" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Use the expensive model for judgment. Use cheap delegates for bounded independent work.</text>

  <g filter="url(#softShadow)">
    <rect x="88" y="365" width="250" height="150" rx="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="213" y="420" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Task arrives</text>
    <text x="213" y="462" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">bugfix, feature,</text>
    <text x="213" y="492" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">audit, architecture</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="560" y="315" width="480" height="260" rx="42" fill="url(#pro)" stroke="#dbeafe" stroke-width="3"/>
    <text x="800" y="388" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">DeepSeek V4 Pro</text>
    <text x="800" y="431" text-anchor="middle" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Lead orchestrator + final coder</text>
    <text x="800" y="482" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">decomposes · judges tradeoffs · merges conflicts</text>
    <text x="800" y="516" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">owns architecture · owns final answer</text>
  </g>

  <g stroke="#8bd3ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M350 440 C430 440 470 440 540 440"/>
    <path d="M1045 440 C1120 440 1170 440 1240 440"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1260" y="365" width="260" height="150" rx="30" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="1390" y="420" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">Final output</text>
    <text x="1390" y="462" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">patch, decision,</text>
    <text x="1390" y="492" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">plan, or review</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="190" y="205" width="260" height="105" rx="24" fill="url(#flash)" stroke="#bae6fd" stroke-width="2"/>
    <text x="320" y="248" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Flash delegate</text>
    <text x="320" y="282" text-anchor="middle" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">implementation path</text>

    <rect x="510" y="175" width="260" height="105" rx="24" fill="url(#flash)" stroke="#bae6fd" stroke-width="2"/>
    <text x="640" y="218" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Flash delegate</text>
    <text x="640" y="252" text-anchor="middle" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">regression risk</text>

    <rect x="830" y="175" width="260" height="105" rx="24" fill="url(#flash)" stroke="#bae6fd" stroke-width="2"/>
    <text x="960" y="218" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Flash delegate</text>
    <text x="960" y="252" text-anchor="middle" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">context packer</text>

    <rect x="1150" y="205" width="260" height="105" rx="24" fill="url(#flash)" stroke="#bae6fd" stroke-width="2"/>
    <text x="1280" y="248" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Flash delegate</text>
    <text x="1280" y="282" text-anchor="middle" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">alternative design</text>
  </g>

  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.82">
    <path d="M320 315 C450 345 505 365 560 385"/>
    <path d="M640 285 C690 300 725 305 755 315"/>
    <path d="M960 285 C920 300 880 305 845 315"/>
    <path d="M1280 315 C1150 345 1095 365 1040 385"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="535" y="680" width="530" height="115" rx="28" fill="url(#gemma)" stroke="#fef3c7" stroke-width="2"/>
    <text x="800" y="728" text-anchor="middle" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">Gemma4 local junior pass</text>
    <text x="800" y="765" text-anchor="middle" fill="#3b1d05" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">readability · pseudocode · obvious maintainability risks</text>
  </g>
  <path d="M800 675 C800 635 800 610 800 580" stroke="#fde68a" stroke-width="4" stroke-dasharray="12 12" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="835" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Rule: add another agent only when it owns a separate context, hypothesis, risk, or source lane.</text>
</svg>
