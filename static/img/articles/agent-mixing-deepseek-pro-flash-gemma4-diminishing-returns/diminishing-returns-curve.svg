<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1600 900">
  <title>Diminishing returns curve for multi-agent coding workflows</title>
  <desc>A curve showing that one to three agents are usually useful, four to six can help when tasks are sliced well, and too many agents create duplicate findings, merge cost, and contradiction cost.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#061423"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="90" y="92" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">The diminishing-returns line</text>
  <text x="92" y="136" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Agent count helps only while each delegate owns independent work.</text>

  <g transform="translate(135 185)">
    <rect x="0" y="0" width="1280" height="545" rx="32" fill="#0f172a" stroke="#1e3a8a" stroke-width="2" filter="url(#shadow2)"/>
    <g stroke="#334155" stroke-width="1">
      <path d="M100 60H1200M100 150H1200M100 240H1200M100 330H1200M100 420H1200"/>
      <path d="M220 40V465M360 40V465M500 40V465M640 40V465M780 40V465M920 40V465M1060 40V465"/>
    </g>

    <rect x="100" y="40" width="310" height="425" fill="#0f766e" opacity="0.16"/>
    <rect x="410" y="40" width="360" height="425" fill="#1d4ed8" opacity="0.13"/>
    <rect x="770" y="40" width="430" height="425" fill="#be123c" opacity="0.14"/>

    <text x="255" y="82" text-anchor="middle" fill="#99f6e4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">useful by default</text>
    <text x="590" y="82" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">useful if sliced well</text>
    <text x="985" y="82" text-anchor="middle" fill="#fecdd3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">noise risk</text>

    <path d="M100 465H1200" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M100 465V40" stroke="#cbd5e1" stroke-width="3"/>

    <path d="M120 415 C220 300 305 210 410 150 C545 75 665 90 775 145 C910 215 1030 310 1180 390"
          fill="none" stroke="url(#curve)" stroke-width="12" stroke-linecap="round"/>

    <g fill="#ffffff" stroke="#0f172a" stroke-width="5">
      <circle cx="120" cy="415" r="14"/>
      <circle cx="410" cy="150" r="14"/>
      <circle cx="640" cy="96" r="14"/>
      <circle cx="910" cy="215" r="14"/>
      <circle cx="1180" cy="390" r="14"/>
    </g>

    <g fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
      <text x="120" y="505">1</text>
      <text x="410" y="505">3</text>
      <text x="640" y="505">5</text>
      <text x="910" y="505">8</text>
      <text x="1180" y="505">10+</text>
    </g>

    <text x="650" y="535" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle">number of agents</text>
    <text x="-245" y="48" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" transform="rotate(-90)">net value after merge cost</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="405" y="138" fill="#f8fafc" font-size="22" font-weight="800">sweet spot</text>
      <text x="405" y="170" fill="#bfdbfe" font-size="18">lead + reviewer + risk scout</text>
      <text x="802" y="250" fill="#f8fafc" font-size="22" font-weight="800">diminishing returns</text>
      <text x="802" y="282" fill="#fecdd3" font-size="18">duplicate findings and contradictions rise</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">
    <text x="100" y="805">Stop adding delegates when the next one cannot inspect a different source, hypothesis, risk, or file surface.</text>
    <text x="100" y="845">A bigger agent room is not a strategy. A cleaner context contract is.</text>
  </g>
</svg>
