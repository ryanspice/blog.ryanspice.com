<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Inside one 1000-byte PocketMic datagram</title><desc id="desc">Proportional stacked bar: 960 bytes audio ciphertext, 24 bytes header, 16 bytes authentication tag. At 100 packets per second the application datagrams use 800 kilobits per second, excluding UDP, IP, link overhead and control traffic.</desc><rect width="900" height="540" rx="24" fill="#111b26"/><g font-family="system-ui,sans-serif"><text x="40" y="53" fill="#dcb66b" font-size="15" letter-spacing="3">POCKETMIC LAN / PACKET BUDGET</text><text x="40" y="99" fill="#f6f2e9" font-size="34" font-weight="700">1,000 bytes. Every 10 milliseconds.</text><text x="40" y="139" fill="#c0cdd5" font-size="19">Proportional composition • protocol values, not measured throughput</text>
<rect x="40" y="185" width="787.2" height="70" fill="#dcb66b"/><rect x="827.2" y="185" width="19.68" height="70" fill="#69bcb7"/><rect x="846.88" y="185" width="13.12" height="70" fill="#a497db"/><text x="62" y="229" fill="#111b26" font-size="25" font-weight="700">96% audio</text>
<g font-size="21" fill="#f6f2e9"><rect x="40" y="293" width="18" height="18" fill="#dcb66b"/><text x="70" y="310">960 B audio</text><rect x="335" y="293" width="18" height="18" fill="#69bcb7"/><text x="365" y="310">24 B header</text><rect x="635" y="293" width="18" height="18" fill="#a497db"/><text x="665" y="310">16 B GCM tag</text></g>
<path d="M40 347H860" stroke="#526472"/><text x="40" y="398" fill="#f6f2e9" font-size="30" font-weight="700">768 + 32 = 800 kbit/s</text><text x="40" y="434" fill="#c0cdd5" font-size="19">Audio payload + PocketMic framing = audio datagram rate</text><text x="40" y="493" fill="#c0cdd5" font-size="18">Excludes UDP/IP headers, Wi-Fi/Ethernet overhead, and control traffic.</text></g></svg>
