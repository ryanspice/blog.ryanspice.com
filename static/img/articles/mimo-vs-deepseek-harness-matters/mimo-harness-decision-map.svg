<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Qualitative harness decision map</title><desc id="desc">A qualitative map connecting workflow needs to Codex, Hermes, Claude Code, and T3 Code.</desc><rect width="1400" height="900" rx="36" fill="#101522"/><text x="80" y="100" fill="#f8f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Choose the surface for the work</text><text x="80" y="148" fill="#aeb9d8" font-family="Inter,Segoe UI,sans-serif" font-size="23">A qualitative map of workflow fit — not a performance ranking.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="22" fill="#fff"><rect x="80" y="255" width="400" height="100" rx="20" fill="#1d2949" stroke="#7891ff" stroke-width="3"/><text x="112" y="300">Need integrated repo context?</text><text x="112" y="333" fill="#aebeff">Try Codex</text><rect x="80" y="405" width="400" height="100" rx="20" fill="#1d2949" stroke="#7891ff" stroke-width="3"/><text x="112" y="450">Need explicit orchestration?</text><text x="112" y="483" fill="#aebeff">Try Hermes</text><rect x="80" y="555" width="400" height="100" rx="20" fill="#1d2949" stroke="#7891ff" stroke-width="3"/><text x="112" y="600">Need a compatible API route?</text><text x="112" y="633" fill="#aebeff">Consider Claude Code + gateway</text><rect x="80" y="705" width="400" height="100" rx="20" fill="#1d2949" stroke="#7891ff" stroke-width="3"/><text x="112" y="750">Need session navigation?</text><text x="112" y="783" fill="#aebeff">Try T3 Code</text><path d="M480 305h240M480 455h240M480 605h240M480 755h240" stroke="#dbe3ff" stroke-width="4"/><path d="m700 291 24 14-24 14M700 441l24 14-24 14M700 591l24 14-24 14M700 741l24 14-24 14" fill="none" stroke="#dbe3ff" stroke-width="4"/><rect x="770" y="300" width="500" height="460" rx="28" fill="#182b2c" stroke="#65d7ce" stroke-width="3"/><text x="820" y="385">Keep the repository stable</text><text x="820" y="455" fill="#b9ece7">Project instructions</text><text x="820" y="505" fill="#b9ece7">Review and source control</text><text x="820" y="555" fill="#b9ece7">Tool permissions and tests</text><text x="820" y="660" fill="#d8fff9">Change the route when useful;</text><text x="820" y="697" fill="#d8fff9">keep the work loop legible.</text></g><text x="80" y="855" fill="#8f9cbd" font-family="Inter,Segoe UI,sans-serif" font-size="19">Original diagram by Ryan Spice · qualitative synthesis of linked documentation and field notes</text></svg>
