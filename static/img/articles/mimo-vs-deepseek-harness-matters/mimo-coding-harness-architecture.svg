<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Coding model and harness architecture</title><desc id="desc">Model providers flow through a compatibility layer into coding harnesses and runtimes, then through a control surface to repository tools.</desc><rect width="1600" height="900" rx="36" fill="#0b1020"/><text x="96" y="105" fill="#f7f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">The model is one layer of the coding loop</text><text x="96" y="155" fill="#aeb9d8" font-family="Inter,Segoe UI,sans-serif" font-size="24">Portability changes the route; the harness changes the work loop.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="24" fill="#fff"><rect x="88" y="300" width="250" height="250" rx="24" fill="#19264d" stroke="#7891ff" stroke-width="3"/><text x="120" y="390">Model / provider</text><text x="120" y="440" fill="#c8d2ed">MiMo · DeepSeek</text><rect x="414" y="300" width="250" height="250" rx="24" fill="#2b214c" stroke="#d58cff" stroke-width="3"/><text x="446" y="390">Compatibility</text><text x="446" y="440">layer / gateway</text><rect x="740" y="300" width="250" height="250" rx="24" fill="#163d43" stroke="#65d7ce" stroke-width="3"/><text x="772" y="390">Harness / runtime</text><text x="772" y="440">Claude · Codex · Hermes</text><rect x="1066" y="300" width="250" height="250" rx="24" fill="#49331e" stroke="#ffc477" stroke-width="3"/><text x="1098" y="390">Control surface</text><text x="1098" y="440">T3 Code</text><rect x="1392" y="300" width="150" height="250" rx="24" fill="#26352b" stroke="#9be38c" stroke-width="3"/><text x="1416" y="390">Repo /</text><text x="1416" y="430">tools</text></g><g fill="none" stroke="#dbe3ff" stroke-width="5" stroke-linecap="round"><path d="M348 425h54m-16-14 16 14-16 14M674 425h54m-16-14 16 14-16 14M1000 425h54m-16-14 16 14-16 14M1326 425h42m-16-14 16 14-16 14"/></g><text x="96" y="720" fill="#e6ebff" font-family="Inter,Segoe UI,sans-serif" font-size="25">The arrows describe routing boundaries, not a benchmark or a promise of vendor support.</text><text x="96" y="770" fill="#8f9cbd" font-family="Inter,Segoe UI,sans-serif" font-size="20">Original diagram by Ryan Spice · linked project and provider documentation support the article</text></svg>
