<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">Shared blog source publishing to Ryan Spice and Canopy Digital sites</title>
	<desc id="desc">A diagram with one source branch feeding two themed static blog builds for blog.ryanspice.com and blog.canopydigital.ca.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f8fbf8" />
			<stop offset="0.52" stop-color="#eef7f0" />
			<stop offset="1" stop-color="#dcefe8" />
		</linearGradient>
		<linearGradient id="ryan" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1d2b53" />
			<stop offset="1" stop-color="#7c5cff" />
		</linearGradient>
		<linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0f5f4c" />
			<stop offset="1" stop-color="#6fbe7d" />
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#123024" flood-opacity="0.15" />
		</filter>
	</defs>
	<rect width="1600" height="900" fill="url(#bg)" />
	<path d="M0 720 C260 650 360 780 590 710 C840 635 950 500 1220 570 C1410 620 1500 600 1600 530 L1600 900 L0 900 Z" fill="#cfe8d9" opacity="0.72" />
	<path d="M0 785 C280 710 420 815 650 745 C900 670 1030 580 1270 640 C1440 682 1518 670 1600 618 L1600 900 L0 900 Z" fill="#b8ddcc" opacity="0.68" />

	<g filter="url(#shadow)">
		<rect x="500" y="132" width="600" height="238" rx="22" fill="#ffffff" stroke="#c8ddcf" stroke-width="2" />
		<rect x="535" y="168" width="530" height="42" rx="8" fill="#e8f4ec" />
		<rect x="535" y="232" width="330" height="22" rx="6" fill="#b8d7c3" />
		<rect x="535" y="272" width="460" height="18" rx="5" fill="#d5e8dc" />
		<rect x="535" y="306" width="410" height="18" rx="5" fill="#d5e8dc" />
		<circle cx="1015" cy="264" r="48" fill="#0f5f4c" opacity="0.12" />
		<path d="M991 272 C1004 238 1029 226 1046 218 C1042 252 1024 280 991 294 Z" fill="#0f5f4c" />
	</g>

	<g fill="none" stroke-linecap="round" stroke-width="8">
		<path d="M710 390 C620 485 510 505 425 560" stroke="#5f6a96" />
		<path d="M890 390 C980 485 1090 505 1175 560" stroke="#2f8b68" />
	</g>
	<g fill="#ffffff" stroke="#d9e6dc" stroke-width="2">
		<circle cx="710" cy="390" r="18" />
		<circle cx="890" cy="390" r="18" />
		<circle cx="425" cy="560" r="18" />
		<circle cx="1175" cy="560" r="18" />
	</g>

	<g filter="url(#shadow)">
		<rect x="178" y="555" width="470" height="210" rx="18" fill="#ffffff" stroke="#d6dceb" stroke-width="2" />
		<rect x="178" y="555" width="470" height="82" rx="18" fill="url(#ryan)" />
		<text x="224" y="610" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="700">Ryan Spice</text>
		<text x="224" y="681" fill="#26334f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Personal technical blog</text>
		<text x="224" y="724" fill="#5d667a" font-family="Inter, Arial, sans-serif" font-size="22">Articles, dev log, library, owner tools</text>
	</g>

	<g filter="url(#shadow)">
		<rect x="952" y="555" width="470" height="210" rx="18" fill="#ffffff" stroke="#c8ddcf" stroke-width="2" />
		<rect x="952" y="555" width="470" height="82" rx="18" fill="url(#canopy)" />
		<text x="998" y="610" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="700">Canopy Digital</text>
		<text x="998" y="681" fill="#18382c" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Lightweight themed build</text>
		<text x="998" y="724" fill="#506f61" font-family="Inter, Arial, sans-serif" font-size="22">Published articles, Canopy RSS, sitemap</text>
	</g>

	<text x="800" y="105" text-anchor="middle" fill="#17382c" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">One publishing system. Two public surfaces.</text>
	<text x="800" y="444" text-anchor="middle" fill="#506f61" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">production builds both domains from the same commit</text>
</svg>
