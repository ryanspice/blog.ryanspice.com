<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenJarvis local-first personal AI stack</title>
  <desc id="desc">A balanced navy and gold technical illustration showing local AI on a personal workstation with cloud fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset="0.58" stop-color="#0b1f33"/><stop offset="1" stop-color="#10283f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d879"/><stop offset="1" stop-color="#b68a2d"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:48px;fill:#eaf6ff;letter-spacing:-.03em;font-weight:700}.small{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#9fb8cc}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#87a2b8}.line{stroke:#5caed6;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:10 14;opacity:.72}.panel{fill:#0d2238;stroke:#2f6c8d;stroke-width:3}.chip{fill:#102d48;stroke:#78d4ff;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".18" stroke="#79b9d9" stroke-width="1"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
  <text x="90" y="105" class="label">OpenJarvis: local AI becomes a full stack</text>
  <text x="92" y="150" class="small">Personal device first. Cloud fallback second. Tools, memory, agents, and learning in the middle.</text>

  <g transform="translate(120 230)">
    <rect class="panel" width="520" height="400" rx="32"/>
    <rect x="55" y="68" width="410" height="232" rx="24" fill="#081726" stroke="#6fbbe2" stroke-width="4"/>
    <circle cx="260" cy="184" r="74" fill="none" stroke="url(#gold)" stroke-width="9" filter="url(#glow)"/>
    <path d="M214 184h92M260 138v92M232 156l56 56M288 156l-56 56" stroke="#f2d276" stroke-width="5" stroke-linecap="round"/>
    <rect x="208" y="328" width="104" height="22" rx="11" fill="#35566b"/>
    <rect x="156" y="358" width="208" height="26" rx="13" fill="#132e48" stroke="#5caed6" stroke-width="3"/>
    <text x="55" y="43" class="small">Local workstation</text>
    <text x="55" y="438" class="tiny">Ollama / llama.cpp / tools / private traces</text>
  </g>

  <g transform="translate(725 206)">
    <rect class="chip" width="420" height="72" rx="20"/><text x="30" y="46" class="small">1. Intelligence</text>
    <rect class="chip" y="92" width="420" height="72" rx="20"/><text x="30" y="138" class="small">2. Engine</text>
    <rect class="chip" y="184" width="420" height="72" rx="20"/><text x="30" y="230" class="small">3. Agents</text>
    <rect class="chip" y="276" width="420" height="72" rx="20"/><text x="30" y="322" class="small">4. Tools + Memory</text>
    <rect class="chip" y="368" width="420" height="72" rx="20"/><text x="30" y="414" class="small">5. Learning loop</text>
  </g>

  <path class="line" d="M640 430C690 370 694 254 725 242"/>
  <path class="line" d="M640 430C690 412 695 426 725 426"/>
  <path class="line" d="M640 430C690 520 695 576 725 574"/>

  <g transform="translate(1240 590)">
    <path d="M40 92c-35 0-64-24-64-54 0-29 25-52 57-55 16-32 52-55 94-55 53 0 96 33 105 78 36 6 64 32 64 64 0 36-36 66-82 66H40z" fill="#122d47" stroke="#6fbbe2" stroke-width="4"/>
    <text x="14" y="62" class="small">Cloud fallback</text>
    <text x="16" y="95" class="tiny">optional escalation</text>
  </g>
  <path d="M1145 565C1200 610 1225 640 1240 660" stroke="#d7b35c" stroke-width="5" fill="none" stroke-dasharray="12 12" opacity=".8"/>

  <g transform="translate(90 748)"><rect width="1420" height="76" rx="28" fill="#071725" stroke="#35566b" stroke-width="2"/><text x="34" y="48" class="small">The important shift: local AI is moving from model runners to measurable personal-agent operating stacks.</text></g>
</svg>
