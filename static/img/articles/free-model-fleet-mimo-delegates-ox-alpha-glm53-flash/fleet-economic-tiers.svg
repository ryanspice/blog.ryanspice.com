<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three-tier coding fleet economics</title>
  <desc id="desc">Flat-rate subscription (MiMo Pro), free-tier lanes (OpenRouter, NVIDIA NIM, GLM-5.3-Flash), and paid upgrades (DeepSeek Pro) form the three economic tiers of the fleet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" x2="1">
      <stop offset="0" stop-color="#f4c273"/>
      <stop offset="1" stop-color="#f59e69"/>
    </linearGradient>
    <linearGradient id="free" x1="0" x2="1">
      <stop offset="0" stop-color="#48c5d6"/>
      <stop offset="1" stop-color="#2f9bc2"/>
    </linearGradient>
    <linearGradient id="paid" x1="0" x2="1">
      <stop offset="0" stop-color="#8f9fff"/>
      <stop offset="1" stop-color="#6678e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="48" y="44" width="1104" height="632" rx="22" fill="#0b1928" stroke="#28445b"/>

  <text x="92" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Three economic tiers</text>
  <text x="92" y="152" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="20">The free tier is the default, not the fallback</text>

  <!-- Tier 1: Flat-rate -->
  <g filter="url(#shadow)">
    <rect x="92" y="200" width="300" height="380" rx="22" fill="#1a1508" stroke="#f4c273" stroke-width="3"/>
    <text x="242" y="260" text-anchor="middle" fill="#f4c273" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Flat-rate</text>
    <text x="242" y="295" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">subscription</text>
    <text x="242" y="350" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">$0</text>
    <text x="242" y="380" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="16">marginal cost</text>
    <line x1="132" y1="410" x2="352" y2="410" stroke="#f4c273" stroke-width="1" opacity="0.4"/>
    <text x="132" y="445" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18">MiMo V2.5 Pro</text>
    <text x="132" y="475" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">1M ctx · high reasoning</text>
    <text x="132" y="510" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18">MiMo V2.5 Fast</text>
    <text x="132" y="540" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">1M ctx · multimodal · 1/3 cost</text>
  </g>

  <!-- Tier 2: Free -->
  <g filter="url(#shadow)">
    <rect x="430" y="200" width="340" height="380" rx="22" fill="#081a1e" stroke="#48c5d6" stroke-width="3"/>
    <text x="600" y="260" text-anchor="middle" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Free tier</text>
    <text x="600" y="295" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">rate-limited, permanent</text>
    <text x="600" y="350" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">$0</text>
    <text x="600" y="380" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="16">per million tokens</text>
    <line x1="470" y1="410" x2="730" y2="410" stroke="#48c5d6" stroke-width="1" opacity="0.4"/>
    <text x="470" y="445" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17">GLM-5.3-Flash:free  NEW</text>
    <text x="470" y="475" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">1M ctx · multimodal · coding</text>
    <text x="470" y="510" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17">Laguna · Nemotron · North</text>
    <text x="470" y="540" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">OpenRouter free rotation</text>
    <text x="470" y="568" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17">DeepSeek Flash (NVIDIA)</text>
  </g>

  <!-- Tier 3: Paid -->
  <g filter="url(#shadow)">
    <rect x="808" y="200" width="300" height="380" rx="22" fill="#0c0f1e" stroke="#8f9fff" stroke-width="3"/>
    <text x="958" y="260" text-anchor="middle" fill="#8f9fff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Paid upgrades</text>
    <text x="958" y="295" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">when free lanes stall</text>
    <text x="958" y="350" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">$$</text>
    <text x="958" y="380" text-anchor="middle" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="16">per million tokens</text>
    <line x1="848" y1="410" x2="1068" y2="410" stroke="#8f9fff" stroke-width="1" opacity="0.4"/>
    <text x="848" y="445" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17">DeepSeek V4 Pro</text>
    <text x="848" y="475" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">$0.435/$0.87 · thinking</text>
    <text x="848" y="510" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17">GLM-5.3-Flash (paid)</text>
    <text x="848" y="540" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="15">$0.075/$0.25 · fallback</text>
  </g>

  <!-- Default arrow -->
  <g fill="none" stroke="#48c5d6" stroke-width="4" stroke-dasharray="12 8">
    <path d="M600 590 L600 640"/>
  </g>
  <text x="600" y="668" text-anchor="middle" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">default lane</text>

  <text x="92" y="700" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">Fleet economics as of August 26, 2026. Free tiers are rate-limited but permanent.</text>
</svg>