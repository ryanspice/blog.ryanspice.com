<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fugu lane routing with GLM-5.3-Flash</title>
  <desc id="desc">A conductor routes work to MiMo Pro, MiMo Fast, GLM-5.3-Flash, DeepSeek, and free-tier lanes. GLM-5.3-Flash is the new free coding-batch specialist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06110f"/>
      <stop offset="0.52" stop-color="#0d1d19"/>
      <stop offset="1" stop-color="#18220f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10241f"/>
      <stop offset="1" stop-color="#182d25"/>
    </linearGradient>
    <linearGradient id="new" x1="0" x2="1">
      <stop offset="0" stop-color="#0e3a3e"/>
      <stop offset="1" stop-color="#1a5a5e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d5b35f"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#48c5d6"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1335" cy="120" r="260" fill="#a3e635" opacity="0.04"/>
  <circle cx="175" cy="755" r="330" fill="#38bdf8" opacity="0.04"/>

  <text x="96" y="112" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Fugu Lane Routing</text>
  <text x="98" y="158" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="24">One conductor, bounded specialist packets, cross-family verification</text>

  <!-- Conductor -->
  <g filter="url(#softShadow)">
    <rect x="595" y="220" width="410" height="180" rx="28" fill="#14251f" stroke="#d5b35f" stroke-width="3"/>
    <text x="800" y="290" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Conductor</text>
    <text x="800" y="330" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="20">scope, routing, synthesis</text>
    <text x="800" y="365" text-anchor="middle" fill="#a3e635" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">author never verifies itself</text>
  </g>

  <!-- MiMo Pro -->
  <g filter="url(#softShadow)">
    <rect x="96" y="460" width="260" height="140" rx="22" fill="url(#panel)" stroke="#f4c273" stroke-width="2"/>
    <text x="136" y="510" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">MiMo Pro</text>
    <text x="136" y="545" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">hard implementation</text>
    <text x="136" y="575" fill="#f4c273" font-family="Segoe UI, Arial, sans-serif" font-size="15">flat-rate · 1M ctx</text>
  </g>

  <!-- MiMo Fast -->
  <g filter="url(#softShadow)">
    <rect x="396" y="460" width="260" height="140" rx="22" fill="url(#panel)" stroke="#f4c273" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="436" y="510" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">MiMo Fast</text>
    <text x="436" y="545" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">recon · scouts · visual</text>
    <text x="436" y="575" fill="#f4c273" font-family="Segoe UI, Arial, sans-serif" font-size="15">flat-rate · 1/3 cost · multimodal</text>
  </g>

  <!-- GLM-5.3-Flash (NEW) -->
  <g filter="url(#softShadow)">
    <rect x="696" y="460" width="280" height="140" rx="22" fill="url(#new)" stroke="#48c5d6" stroke-width="3"/>
    <text x="736" y="505" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">GLM-5.3-Flash</text>
    <text x="940" y="505" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">NEW</text>
    <text x="736" y="540" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">coding batches · parallel scouts</text>
    <text x="736" y="570" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="15">free · 1M ctx · multimodal</text>
    <text x="736" y="595" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="15">320B MoE · 18B active</text>
  </g>

  <!-- DeepSeek Pro -->
  <g filter="url(#softShadow)">
    <rect x="1016" y="460" width="260" height="140" rx="22" fill="url(#panel)" stroke="#8f9fff" stroke-width="2"/>
    <text x="1056" y="510" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">DeepSeek Pro</text>
    <text x="1056" y="545" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">thinking · review</text>
    <text x="1056" y="575" fill="#8f9fff" font-family="Segoe UI, Arial, sans-serif" font-size="15">paid · 1M ctx · 384K out</text>
  </g>

  <!-- Free tier -->
  <g filter="url(#softShadow)">
    <rect x="1316" y="460" width="220" height="140" rx="22" fill="url(#panel)" stroke="#a3e635" stroke-width="2"/>
    <text x="1356" y="510" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Free tier</text>
    <text x="1356" y="545" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">Laguna · Nemotron</text>
    <text x="1356" y="575" fill="#a3e635" font-family="Segoe UI, Arial, sans-serif" font-size="15">rate-limited rotation</text>
  </g>

  <!-- Arrows from conductor to lanes -->
  <path d="M 700 400 C 500 420 300 440 226 460" fill="none" stroke="#d5b35f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 750 400 C 600 430 500 440 526 460" fill="none" stroke="#d5b35f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 800 400 L 836 460" fill="none" stroke="#48c5d6" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M 850 400 C 950 430 1050 440 1146 460" fill="none" stroke="#d5b35f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 900 400 C 1100 420 1250 440 1426 460" fill="none" stroke="#d5b35f" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Fallback chain -->
  <g filter="url(#softShadow)">
    <rect x="350" y="680" width="900" height="80" rx="20" fill="#0f1f1b" stroke="#bed7c9" stroke-width="1.5"/>
    <text x="800" y="720" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">GLM-5.3-Flash fallback: MiMo Pro → DeepSeek Flash (NVIDIA) → Laguna</text>
    <text x="800" y="748" text-anchor="middle" fill="#bed7c9" font-family="Segoe UI, Arial, sans-serif" font-size="16">auto-rotation on quota/rate-limit, attested in packet receipt</text>
  </g>

  <!-- Verification matrix -->
  <g filter="url(#softShadow)">
    <rect x="350" y="790" width="900" height="60" rx="18" fill="#0f1f1b" stroke="#facc15" stroke-width="1.5"/>
    <text x="800" y="828" text-anchor="middle" fill="#fff7df" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">GLM-5.3-Flash author → verify with DeepSeek, Spark, Nemotron, or VibeThinker</text>
  </g>
</svg>