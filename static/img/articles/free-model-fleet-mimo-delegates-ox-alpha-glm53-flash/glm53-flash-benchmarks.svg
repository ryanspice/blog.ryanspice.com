<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Chinese and Asian AI model availability and context snapshot</title>
  <desc id="desc">Horizontal bar chart from the September 2, 2026 OpenRouter model API snapshot. Teal rows are exact zero-price hosted listings and violet rows are paid Asian-origin comparison routes. GLM-5.3-Flash is included at 1.31 million context tokens but is paid. MiniMax M3, MiniMax M2.7, GLM-5.2, and Ling 3.0 Flash Fin are listed at zero price.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#12283a"/></linearGradient><linearGradient id="free" x1="0" x2="1"><stop offset="0" stop-color="#48c5d6"/><stop offset="1" stop-color="#2f9bc2"/></linearGradient><linearGradient id="paid" x1="0" x2="1"><stop offset="0" stop-color="#b69cff"/><stop offset="1" stop-color="#7446c7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/></filter></defs>
  <rect width="1200" height="980" rx="28" fill="url(#bg)"/><rect x="44" y="38" width="1112" height="900" rx="22" fill="#0b1928" stroke="#28445b"/>
  <text x="86" y="102" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Chinese + Asian model availability — live snapshot</text>
  <text x="86" y="140" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">OpenRouter API · 2026-09-02 · context window, not a capability score</text>
  <rect x="86" y="168" width="18" height="18" rx="4" fill="url(#free)"/><text x="116" y="184" fill="#b9d7df" font-family="Segoe UI, Arial, sans-serif" font-size="17">exact $0 input + output</text><rect x="350" y="168" width="18" height="18" rx="4" fill="url(#paid)"/><text x="380" y="184" fill="#d4c8f3" font-family="Segoe UI, Arial, sans-serif" font-size="17">paid route, comparison only</text>
  <g stroke="#294258" stroke-width="1"><line x1="390" y1="220" x2="390" y2="810"/><line x1="520" y1="220" x2="520" y2="810"/><line x1="650" y1="220" x2="650" y2="810"/><line x1="780" y1="220" x2="780" y2="810"/><line x1="910" y1="220" x2="910" y2="810"/><line x1="1040" y1="220" x2="1040" y2="810"/></g>
  <g fill="#7290a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle"><text x="390" y="838">0</text><text x="520" y="838">256K</text><text x="650" y="838">512K</text><text x="780" y="838">768K</text><text x="910" y="838">1M</text><text x="1040" y="838">1.31M</text></g>
  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600"><text x="82" y="252">GLM-5.3-Flash</text><text x="82" y="316">DeepSeek V4 Flash</text><text x="82" y="380">MiMo V2.5</text><text x="82" y="444">Qwen3.8 Flash</text><text x="82" y="508">Kimi K2.7 Code</text><text x="82" y="572">MiniMax M3</text><text x="82" y="636">MiniMax M2.7</text><text x="82" y="700">GLM-5.2</text><text x="82" y="764">Ling 3.0 Flash Fin</text></g>
  <g filter="url(#shadow)"><rect x="390" y="228" width="650" height="34" rx="9" fill="url(#paid)"/><rect x="390" y="292" width="650" height="34" rx="9" fill="url(#paid)"/><rect x="390" y="356" width="650" height="34" rx="9" fill="url(#paid)"/><rect x="390" y="420" width="650" height="34" rx="9" fill="url(#paid)"/><rect x="390" y="484" width="520" height="34" rx="9" fill="url(#paid)"/><rect x="390" y="548" width="650" height="34" rx="9" fill="url(#free)"/><rect x="390" y="612" width="490" height="34" rx="9" fill="url(#free)"/><rect x="390" y="676" width="520" height="34" rx="9" fill="url(#free)"/><rect x="390" y="740" width="523" height="34" rx="9" fill="url(#free)"/></g>
  <g fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800"><text x="1052" y="252">1.31M · paid</text><text x="1052" y="316">1.05M · paid</text><text x="1052" y="380">1.05M · paid</text><text x="1052" y="444">1M · paid</text><text x="922" y="508">256K · paid</text><text x="1052" y="572">1.05M · FREE</text><text x="892" y="636">196K · FREE</text><text x="922" y="700">256K · FREE</text><text x="925" y="764">262K · FREE</text></g>
  <text x="86" y="888" fill="#f5c96a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">READ THIS CORRECTLY</text><text x="86" y="912" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">The four free rows are catalog listings, not proof of quota or account reachability. Open weights and trials are not hosted API free access.</text><text x="86" y="930" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="15">Source: OpenRouter /api/v1/models fetched 2026-09-02; exact slugs and price distinctions are recorded in the article audit.</text>
</svg>
