<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">GLM-5.3-Flash benchmark comparison</title>
  <desc id="desc">Horizontal bar chart comparing GLM-5.3-Flash (84.3 TerminalBench, 63.4 DeepSWE) against GLM-5.3, DeepSeek V4 Pro, and GLM-5.2. Source: Z.ai, DeepSeek, August 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" x2="1">
      <stop offset="0" stop-color="#48c5d6"/>
      <stop offset="1" stop-color="#2f9bc2"/>
    </linearGradient>
    <linearGradient id="glm" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="deepseek" x1="0" x2="1">
      <stop offset="0" stop-color="#8f9fff"/>
      <stop offset="1" stop-color="#6678e8"/>
    </linearGradient>
    <linearGradient id="glm52" x1="0" x2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <rect x="48" y="44" width="1104" height="732" rx="22" fill="#0b1928" stroke="#28445b"/>

  <text x="92" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">GLM-5.3-Flash — coding benchmarks</text>
  <text x="92" y="152" fill="#a8bed0" font-family="Segoe UI, Arial, sans-serif" font-size="20">TerminalBench 2.1 and DeepSWE v1.1 · higher is better</text>

  <!-- TerminalBench section -->
  <text x="92" y="210" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">TerminalBench 2.1</text>

  <g stroke="#294258" stroke-width="1">
    <line x1="350" y1="240" x2="350" y2="520"/>
    <line x1="472" y1="240" x2="472" y2="520"/>
    <line x1="594" y1="240" x2="594" y2="520"/>
    <line x1="716" y1="240" x2="716" y2="520"/>
    <line x1="838" y1="240" x2="838" y2="520"/>
    <line x1="960" y1="240" x2="960" y2="520"/>
    <line x1="1082" y1="240" x2="1082" y2="520"/>
  </g>
  <g fill="#7290a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="350" y="548">0</text>
    <text x="472" y="548">15</text>
    <text x="594" y="548">30</text>
    <text x="716" y="548">45</text>
    <text x="838" y="548">60</text>
    <text x="960" y="548">75</text>
    <text x="1082" y="548">90</text>
  </g>

  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="100" y="298">GLM-5.3-Flash</text>
    <text x="100" y="378">GLM-5.3</text>
    <text x="100" y="458">DeepSeek V4 Pro</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="262" width="650" height="48" rx="12" fill="url(#flash)"/>
    <rect x="350" y="342" width="620" height="48" rx="12" fill="url(#glm)"/>
    <rect x="350" y="422" width="590" height="48" rx="12" fill="url(#deepseek)"/>
  </g>
  <g fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">
    <text x="1020" y="296">84.3</text>
    <text x="990" y="376">80.6</text>
    <text x="960" y="456">76.2</text>
  </g>

  <!-- DeepSWE section -->
  <text x="92" y="610" fill="#48c5d6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">DeepSWE v1.1</text>

  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="100" y="668">GLM-5.3-Flash</text>
    <text x="100" y="728">GLM-5.2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="638" width="475" height="42" rx="10" fill="url(#flash)"/>
    <rect x="350" y="698" width="347" height="42" rx="10" fill="url(#glm52)"/>
  </g>
  <g fill="#06101c" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">
    <text x="845" y="668">63.4</text>
    <text x="717" y="728">46.2</text>
  </g>

  <text x="92" y="790" fill="#7894aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">Source: Z.ai launch notes (2026-08-26), DeepSeek GA notes (2026-08-12). Vendor-reported scores.</text>
</svg>