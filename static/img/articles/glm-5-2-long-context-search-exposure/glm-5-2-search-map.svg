<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GLM-5.2 source exposure and search flow</title>
  <desc id="desc">A diagram showing source exposure, retrieval policy, GLM-5.2 long context, sparse attention token search, IndexShare, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="52%" stop-color="#17202a"/>
      <stop offset="100%" stop-color="#102318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1045" cy="115" r="130" fill="#2563eb" opacity="0.18"/>
  <circle cx="205" cy="570" r="180" fill="#16a34a" opacity="0.14"/>
  <circle cx="1000" cy="585" r="120" fill="#f59e0b" opacity="0.13"/>

  <text x="70" y="82" fill="#ecfdf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">GLM-5.2 search exposure map</text>
  <text x="72" y="122" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Long context makes source policy more important, not less important.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="176" width="214" height="144" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="218" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Source exposure</text>
    <text x="100" y="254" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">repo files</text>
    <text x="100" y="280" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">docs and issues</text>
    <text x="100" y="306" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">web sources</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="368" y="176" width="214" height="144" rx="18" fill="#132315" stroke="#22c55e" stroke-width="2"/>
    <text x="396" y="218" fill="#dcfce7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Retrieval policy</text>
    <text x="396" y="254" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">allow list</text>
    <text x="396" y="280" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">rank and rerank</text>
    <text x="396" y="306" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">exclude with reason</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="664" y="176" width="214" height="144" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
    <text x="692" y="218" fill="#ede9fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1M context</text>
    <text x="692" y="254" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">working set</text>
    <text x="692" y="280" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">memory of decisions</text>
    <text x="692" y="306" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">long-horizon tasks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="176" width="168" height="144" rx="18" fill="#221a0a" stroke="#f59e0b" stroke-width="2"/>
    <text x="988" y="218" fill="#fef3c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Verify</text>
    <text x="988" y="254" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">tests</text>
    <text x="988" y="280" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">citations</text>
    <text x="988" y="306" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">diff review</text>
  </g>

  <path d="M 292 248 L 358 248" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 588 248 L 654 248" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 884 248 L 950 248" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="180" y="404" width="840" height="160" rx="22" fill="#07111f" stroke="#334155" stroke-width="2"/>
    <text x="222" y="450" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Inside the model: sparse-attention token search</text>
    <text x="222" y="490" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">DSA-style indexers select top tokens from long context.</text>
    <text x="222" y="522" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">IndexShare reuses nearby index decisions instead of repeating the same search work.</text>
    <rect x="754" y="436" width="220" height="82" rx="16" fill="#12301f" stroke="#22c55e" stroke-width="2"/>
    <text x="782" y="470" fill="#dcfce7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">IndexShare</text>
    <text x="782" y="500" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">reuse every 4 layers</text>
  </g>

  <path d="M 770 326 C 770 360 762 380 735 404" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)" fill="none"/>
  <path d="M 886 404 C 930 372 995 360 1044 326" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)" fill="none"/>

  <text x="72" y="630" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">The practical question is not just how much GLM-5.2 can see. It is what you expose, how it is ranked, and how the result is verified.</text>
</svg>
